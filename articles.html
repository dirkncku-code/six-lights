<script>window.SITE = {"intro":"我不會教你該怎麼做，但我會分享總經觀察、產業發展趨勢、長期投資的觀點，以及那些自作聰明卻繳了學費的故事。","tags":["景氣循環","總經燈號","水位與風險","投資心態","選股與估值","AI 與半導體","長期投資","市場觀察"],"series":[{"name":"總經系列","desc":"總經不是拿來發財的，是拿來避免受重傷的。","upcoming":["單一燈號都不準，那同時亮幾個呢？","空頭年先減碼，跌深才買"]},{"name":"景氣循環系列","desc":"景氣有四個季節：先搞清楚季節，再決定怎麼投資。","upcoming":[]},{"name":"選股與持有系列","desc":"股票的個性，要跟你的時鐘配。","upcoming":[]},{"name":"41 個月","desc":"0050 定期定額的一筆帳，和它還沒被證明的事。","upcoming":[]}],"featured":["A20260619-44","A20260526-24","A20260602-27","A20260529-25","A20260505-16","A20260625-49"],"articles":[{"id":"A20261012-76","type":"心法","title":"總經能拿來發財嗎？","date":"2026-10-12","series":"總經系列","seq":1,"tags":["總經燈號"],"gist":"總經用來保命，發財靠產業趨勢；VIX 是溫度計","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0277anuK7zbNFe3cZSSEQ4dHuYJNdbK98HkbD13jwwJnfSdK4nhSv3GyuTPtRFhi84l&id=61571663936725","body":"總經系列文章之一 [總經能拿來發財嗎?]\n\n2024 年 7 月，\n各項總經數據在越來越好的路上，\n市場卻突然大幅修正。 🧭\n\n我在股友群、同事圈到處問：(沒有到處怪)\n發生什麼事了？天要塌了阿~\n\n經濟數據說好，股票價格很不好。\n那一次，我開始懷疑：\n看總經，到底能不能預測股市？\n\n我轉念一想，\n經濟學家早就通通發財了。\n\n我們回頭做了一件事。\n把十幾項總經數字打分：\n就業、消費、利率、油價、盈餘……\n想算出明年大盤會漲多少。\n\n回頭檢查三十年，\n這套分數只解釋了報酬的 4%。 ⚠️\n\n我的第一個反應是：\n一定是我解讀數字的方法錯了。\n\n後來想通了。\n我們盯著每一個數字現在是高是低，\n就像只盯著一棵樹的變化，\n卻沒注意到整片森林都在掉葉子。\n\n經濟數據有短期波動跟長期趨勢，\n一個不好的數據不算什麼，\n當不好的數據頻率越來越高，\n而且不是一項，是很多項一起，那才是要出大事了。\n\n一個警示燈亮，不代表什麼；\n很多燈號一起轉弱，風險才真的上來。\n這件事有數據可以說明，下一篇再攤開來講。\n\n所以我換了一個角度來看總經。\n不看「明年會漲多少」，\n而是看「我會不會受重傷，能否持盈保泰?」。\n\n那錢從哪裡賺？從產業趨勢。\n這幾年，台灣受惠於 AI爆發帶來的紅利。\n2020年以前台股上市櫃公司總盈餘不及2兆，\n2026年已經要上看8兆，加權指數為何不能站穩50000點呢?\n只要心態穩定、不短進短出，就能吃得到這波漲幅。\n還記得之前的文章分析過2023年迄今定期定額0050的報酬多可觀嗎?[https://www.facebook.com/share/p/1GNuC6CP1F/]\n\n那研究總經的目的是什麼呢?\n我認為是保命，才有繼續待在場內的條件。\n\nVIX 又是另一回事。\n它沒有方向，只是避險情緒的溫度計。\n走高的時候，減碼、保守以對；\n衝到極度恐慌，反而不再追著減，\n那常常是轉折。 🔧\n\n回到 2024 年。\n8 月 5 日，VIX 盤中衝到 65。\n一個多月後，大盤回到了前高附近。\n\n所以分工是這樣：\n產業趨勢，決定賺不賺得到大錢；\n總經，決定要不要提高戒心；\nVIX，決定這個月要多保守。 ✅\n\n我還在擔心的事：\n這套分工也是回測撞出來的，\n樣本就那幾次衰退。\n下一次，可能跟過去都不一樣。\n但我相信景氣循環始自於人性，而人性幾千年來沒什麼改變。\n\n最後問你：\n你讀總經的時候，看的是一片葉子，還是整片森林？\n\nA. 盯著單一數據，例如非農、CPI\nB. 看的是趨勢，想的是未來該怎麼做?\nC. 新聞說通膨升溫就快逃鴨\n\n下一篇，我們談[單一燈號都不準，那同時亮幾個呢？]\n敬請期待。\n\n*本文為個人心得分享，不構成投資建議。回測樣本有限，可能完全錯誤。*"},{"id":"A20261011-75","type":"盤感","title":"創高之後，等回測支撐","date":"2026-10-11","series":"","seq":0,"tags":["市場觀察"],"gist":"兩個條件：支撐不破、VIX 維持低檔","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02nwV9Aht2hQ8uYAQ5hyoUssKukPZptb7iTMqwdc2QcGeifKMPpoZ62gYqrz6ccAo5l&id=61571663936725","body":"📌 上週說，創高之後等回測支撐。\n這週想法沒變。\n\n大盤在 5 萬點前近鄉情怯，\n台積電、輝達創高後拉回，\n費半正在測支撐。\n\n壓力還是老梗：\n美伊戰爭疑雲、油價再轉強、OpenAI 的營收鬼故事。\n\n🌡️ 但市場在賭這幾件事：\n戰爭打了七個月，油價與地緣已被反覆定價。\n企業獲利年增 28%，前瞻 EPS 還在上修。\n11/3 選前有政治約束，供給端也有對策。\n\n⚠️ 我看的條件只有兩個：\n支撐測試不破，VIX 維持低檔。\n\n🧭 兩個都在，我自己的做法是抱好抱緊。\n訊號不成立，那就切記持盈保泰。\n\n以上是我的看法，非投資建議。"},{"id":"A20261004-74","type":"盤感","title":"油價漲，台股為什麼還創新高？","date":"2026-10-04","series":"","seq":0,"tags":["市場觀察"],"gist":"市場先看需求還在，沒先看成本在漲","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0tcyTzcTLrppcv2vYUjdgGJmaSX1TUnDiajH8QXhgyHQHWspCyvoXpvGR5EEsoochl&id=61571663936725","body":"📉 油價漲、通膨壓不住、美債殖利率高掛，\n為什麼台股創新高、納指準備創高，費半還明顯轉強？\n\n我看到的是三件事：\n\n費半轉強，資金回到科技主線\n台積 ADR 創新高，美光法說強調需求強勁\n美國11月第一週期中選舉落幕，不確定性少一塊\n\n我的判斷是：\n市場現在先看「需求還在」，沒有先看「成本在漲」。\n\n🤖 因為 AI 投資沒有人想踩煞車，\n中國沒有要停下來。\n\n⚠️ 壓力沒有消失，只是目前不是主角。\n\n🧭 我自己的做法：\n已經買好的，坐好坐穩。\n還想買的，等支撐測試。\n前提是，水位本來就在你設計的範圍內。\n\n以上是我的看法，非投資建議。"},{"id":"A20260922-71","type":"盤感","title":"升息之後，基本面回到舞台中央","date":"2026-09-22","series":"","seq":0,"tags":["市場觀察"],"gist":"市場寬度跳升；有子彈就順勢做多，不逆勢看空","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid035JrDtVns1rf6PCHhA23j56zmQ4zHtGRw3dCHoc3Bk952f4T7r19rFe83oovm82FPl&id=61571663936725","body":"上周四凌晨FED升息後，\n總經面的影響正在淡化，\n基本面重回舞台正中央，\n美股與台股一路上漲，\n台股9/22創下歷史新高。\n行情總是來的措手不及... 哪次不一樣?\n\n看看上週的市場寬度，\n台股加權跟上櫃的股票\n站上月季線的比例大幅跳升，\n\n創新高的過程遇到壓力是正常，\n我認為這時候如果還有子彈，要找機會順勢做多，而不是逆勢看空。\n\n另外這張四個象限的圖，\n左上是投信剛開始買的族群，\n右下是投信開始撤退的，讓我們繼續看下去。"},{"id":"A20260922-72","type":"方法","title":"給它規則，它做得很好","date":"2026-09-22","series":"","seq":0,"tags":["AI 與半導體","選股與估值"],"gist":"記憶體本益比便宜是獲利衝出來的；問 AI 一定要問 why","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0PzKq4qxN5G6NSDevUCpdUFtWQYGchGtJRrQ1BGZHuycNfdPn3zMkqzMFsneH5THfl&id=61571663936725","body":"[給它規則，它做得很好]\n\n我問 AI 怎麼看記憶體。🤖\n\n它說本益比在歷史低檔，估值有吸引力。\n\n數字全對。結論可能剛好反了。\n\n━━━━━━━━━━━━━━\n\n記憶體這一輪是從虧損轉盈利。\n\n一開始根本算不出本益比，接著獲利大幅成長，分母愈來愈大，於是預估本益比看起來極度便宜。\n\n這個便宜不是股價跌出來的，是獲利衝出來的。😅\n\n過去的歷史教我們一件事：\n當記憶體股開始用本益比很便宜來說故事，離修正通常就不遠了。\n\n━━━━━━━━━━━━━━\n\n那這次會不會不一樣？我不知道。\n\n但我知道要從哪裡開始問。\n過去每一次，高價的解藥就是高價——價格漲，資本支出跟著上，供給開出來，然後崩盤。這個迴圈沒有例外。\n\n所以要看的是供給端這次回不回得來：\n\n三大廠的資本紀律守不守得住。\n長期合約的結構佔比，跟 HBM 認證綁定的深度。\n\n如果供給這次真的回不來，那才是不一樣。⚠️\n\n在那之前，「這次不一樣」這五個字，我不會先講。\n\n━━━━━━━━━━━━━━\n\nAI 是根據數據說話。\n\n我是根據日常累積的產業知識，給出一個不那麼肯定的高機率情境。\n\n所以我改了問法：不只問看法，一定同時問 why。🔍\n\n拿到 why 再檢查一件事——\n這個理由，放到更長的時間維度上，能不能被驗證？\n\n同一套證據，在一年的尺度上成立，在十年的尺度上完全不成立。\n這一步它不會自己做，因為這不是它思考問題的方式。\n\n━━━━━━━━━━━━━━\n\n我到現在還持有記憶體類股。循環股不會因為我看好它就不循環。\n\n不是因為我確定這次不一樣。是因為 AI 算力的架構在變、供給跟上的速度還沒追上、NVIDIA 又推出 NVHBM、還用降規來救 GPU 出貨——這些現象都指向同一件事：記憶體供不應求。\n\n給AI規則，它做得很好；讓AI下判斷，它會非常有自信地錯。\n\n絕對相信它的判斷，你可能會吃了大虧。\n\n下次 AI 給你一個結論的時候，你有沒有問它 why？🤔\n\n非投資建議。本人持有記憶體相關部位。"},{"id":"A20260913-69","type":"盤感","title":"興櫃降溫、市場寬度下滑","date":"2026-09-13","series":"","seq":0,"tags":["市場觀察"],"gist":"市場寬度下滑要謹慎；盤整區間買在下緣","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid06qkPs9aqQs5VACSPipHfu8wADm3fBWg2u6F8X5SeBGn5Esuz3EGgdC8YdkhMDRkJl&id=61571663936725","body":"之前我有提到，\n興櫃的資金又熱絡起來，但上周又降溫了。\n整體市場觀測方面，市場寬度下滑，代表操作上要謹慎一點。\n本周是總經盤，US10Y已經接近5%，我認為臨界點快到了，下周是FOMC，市場已經price in 升息一碼，就看主席是否依然不給指引。\n基本面依然很好，油價烏雲罩頂，\n盤整區間就是買在下緣，等待否極泰來。"},{"id":"A20260913-70","type":"心法","title":"41 個月，會不會太短","date":"2026-09-13","series":"41 個月","seq":2,"tags":["長期投資"],"gist":"樣本只有一次；選無論哪種可能都還能待在場內的路","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02S8ViQpYrMnHrcLqwArLLd1SHJi7x7SVAdqnGCHMGknYAvK5T3X3fCSnBEJUg2eh9l&id=61571663936725","body":"〈41個月，會不會太短〉\n\n前陣子我算了一筆帳，結論是：方向對了，選股沒那麼重要。\n\n發完之後，心裡有根刺。\n\n同一段期間、同樣的投入方式，我順手算了另外兩個：\n\nVOO 總報酬 +90.4%，QQQ +124.6%，0050 +235.8%。📈\n\n美國那兩個不是表現差，是被 0050 拉開快一倍。\n\n所以那 41 個月證明的，可能不是「指數贏過選股」。\n\n是我剛好站在台灣。\n\n如果我把同樣的紀律搬到 VOO 上，結論還會一樣嗎？我不知道。\n\n41 個月就是 41 個月，它不是 30 年。我手上只有一次樣本，而那個樣本剛好落在一個對台股特別好的窗口裡。\n\n我還是會照這個結論做事。\n\n但不是因為我確定它對。\n\n我們現在看到的是唯一的結果，可是在事情發生之前，卻很多種可能。\n我選的不是報酬率最高的那一條，而是無論哪一種可能，我都還能待在場內的那一條。\n\n至於這 41 個月證明了什麼——它還沒有被時間驗證過。\n\n非投資建議。數字為含息試算，未計交易成本。"},{"id":"A20260907-68","type":"方法","title":"先慮失，再慮得","date":"2026-09-07","series":"","seq":0,"tags":["水位與風險"],"gist":"買之前先算看錯最多輸多少，再回推部位","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0fZ4BtrxL8t2ocitXokhbnL7Y1phsCovcLB6LA7pE5LMmCTzXzWu383tdmdKBER9Al&id=61571663936725","body":"【先慮失，再慮得】2026.09.07\n\n有沒有一檔股票，有好的題材，對的趨勢，蓄勢待發的技術型態，讓你恨不得馬上大筆買進的衝動？\n我懂，而且我知道，你還有錢 XD。\n\n因為我們都被無限可能的獲利衝昏了頭，But…\n事後看那些衝動的買進，有幾次笑到最後？\n\n我認為，在買一檔股票之前，要先思考的是如果這檔我看錯了，輸多少我能接受？\n\n先從它的股性回推，如果下跌多少我要認錯？\n然後從最大虧損的金額往回推——放多少錢、怎麼分批、上限到哪裡。\n不能靠感覺出來，靠的是你的研究深度，公司的產業地位，過去的波動度與未來可能的事件等等。\n\n聽起來很掃興，因為市場正熱的時候，誰在意風險？\n\n📈 先幻想可能賺多少，部位會愈開愈大，因為期待沒有上限。\n🛡️ 先盤算最多輸多少，部位有天花板，而且是自己的決定。\n\n我們進股市是來賺錢的，不是來送命的。\n\n⚠️ 非投資建議。"},{"id":"A20260905-67","type":"心法","title":"賭一把，補不上那個差距","date":"2026-09-05","series":"","seq":0,"tags":["投資心態","水位與風險"],"gist":"相對剝奪感是真的，但跌五成要漲一倍才回本","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid025MufWdTpH8ehhpZLFUiUTSCMMejGFJ6Rz6UuHsRf4ksDqyuijZeyRamoyT1WFyP9l&id=61571663936725","body":"📊 一則新聞，講年輕男性愛當沖，越常交易，越覺得自己是魯蛇。\n\n底下留言吵的不是操作技巧，是房價。\n薪水追不上房價，正常投資太慢，賭一把好像才追得上。\n這句話我看得懂，因為它背後不是貪心，是絕望。💭\n\n看著看著，我腦中浮出的畫面是七月的韓國。\n一模一樣的邏輯——漲得又快又猛，本金不夠就借，\n借到最後，跌一段就斷頭出場。\n七月韓股跌了超過三成，斷頭潮一波接一波。\n七月最後一天，單日反彈超過15%。\n那根反彈，跟已經被斷頭出場的人，一點關係都沒有。⚠️\n\n相對剝奪感是真的，房價壓力是真的。\n但賭一把不會讓你補上那個差距，\n賭輸的時候，本金賠了，\n借來的那部分，還要連本帶利還回去。😮‍💨\n\n慢，不是因為不敢，是算過了——\n跌五成要漲一倍才回本，這個數學不會因為你多急就改變。\n✅\nhttps://youtu.be/lm48rSmTTZM?si=cZ0H2RHn7hmqeetI\n（影片：TVBS〈年輕男性25%天天炒股 64%自認魯蛇〉）\n\n非投資建議。\n\nhttps://www.gvm.com.tw/article/131710?srsltid=AfmBOooXth-qWI-Qy8J_uWsbQpDnT64u5gFT87Qqe8jEfRBL_yrYrKfd 殷鑑不遠"},{"id":"A20260904-66","type":"心法","title":"0050 定期定額 41 期，報酬率比我高","date":"2026-09-04","series":"41 個月","seq":1,"tags":["長期投資"],"gist":"判斷沒輸，操作沒贏；方向對，不提早下車就好","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0252aVKXEc7rukKwPRg2Kyr2A4yoKuCTRWTamig2JZo6H6jL37bACkkqEoesNzQiuRl&id=61571663936725","body":"來問大家一個問題📊\n\n從2023年3月起，本金200萬放進0050，之後每月定期定額2萬。\n\n到今年7月為止，共41期，總共投入282萬元。\n\n猜猜看變成多少？(答案放留言區，先別偷看，自己猜一下)\n\n我為什麼記得這麼清楚？因為我算完發現，報酬率比我高  XD\n____________________________________\n\n這三年我相信AI，勢必整條供應鏈一起漲，而且我看得早。\n\n看對之後就開始下功夫。逐字稿、月營收、客戶集中度、認證進度。\n\n三年半下來，結果是落後0050年化4.2個百分點....\n\n判斷沒輸，操作沒贏。😅\n\n想想有點不甘心，但後來發現這其實是好消息。\n\n因為它的意思是——就算我不是腳踩蓮花，生來作股票的~\n\n就算挑不到最強的那一檔，\n不用壓對輪動順序，不用買在最漂亮的那一天。\n\n只要列車的方向對，然後不提早下車。🚂\n我們要把時間花在辨別長期趨勢，而非迷失於個股短期價格的波動。\n___________________________________________\n\n過去的41個月，我追得不輕鬆，但我一直都在車上，方向正確就行。\n\n你呢? 有坐錯方向的列車了嗎? 🤔\n\n非投資建議。數字為含息試算，未計交易成本。"},{"id":"A20260903-65","type":"盤感","title":"利率是天氣，訂單是體質","date":"2026-09-03","series":"","seq":0,"tags":["市場觀察"],"gist":"資金往興櫃跑，是在找位置，不是在避險","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02MeFNd6f1tghnt34VwGfho7d7dHykT8khbhYfepV8HTAWE6Gk3DJ2hihY1V8RFQS3l&id=61571663936725","body":"美國十年期公債殖利率站上 4.8%，📈\n9月升息預期衝過70%，\n布蘭特原油逼近100 USD，\n照理說這種環境，資金應該往安全的地方縮。\n\n但我看到的是反過來的——\n興櫃的指標股，開始連續性拉抬。\n\n上一次這個現象，是四月美伊停戰的時候。\n\n資金沒有退場，是換地方。🔄\n願意往興櫃跑，代表這些錢不是在避險，\n是在找還沒漲到的位置。\n\n同一週，NVDA 說明年業績要成長七成。\n\n利率會拉高企業的舉債成本，這是真的。\n但只要訂單還在，該拉的貨要拉，該賺的錢不會少。💰\n\n利率是天氣，訂單是體質。\n天氣冷，出門加件衣服；\n體質好的人，冷歸冷，還是可以活蹦亂跳。\n\n接下來我會盯指標股的型態。\n只要還是底底高，我就當這波資金移動還沒結束。\n\n資金開始往風險性資產移動的時候，\n通常不是離場的時機。🚀"},{"id":"A20260902-64","type":"方法","title":"買東西，別忘了看保存期限","date":"2026-09-02","series":"選股與持有系列","seq":1,"tags":["選股與估值"],"gist":"股票的個性要跟你的時鐘配；寧可買貴，不要買錯","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0yns7juKNKdjb92gVcXK84xun7jb2iRV33x9v3fErVCwhv8tiC7MuKFGuTVWbARFUl&id=61571663936725","body":"📖 投資大師霍華 馬克斯有一句話：\n\n投資成功主要不是來自「買好東西」，\n而是來自「買東西買得好」。\n\n他說的是價格。\n好公司買在太貴的地方，一樣賠錢。\n\n這句話我認同。\n\n但我後來發現，「買得好」還有另一半——\n時間維度。\n\n━━━━━━━━━━━━━━\n\n😅 追高權值龍頭那次，我很清楚自己在買什麼。\n\n成長故事明確，產業地位穩固，\n時間本來就站在我們這邊。\n\n既然時間站在我們這邊，我在急什麼？\n\n我還是在最熱的那天按下買進。\n\n用短線的急，買一個長線的理由。\n\n當紅題材股那次剛好相反。\n\n題材燒完了，我還在往下攤平，\n嘴上說「跌下來更便宜」。\n\n抱到最後，抱成了長期投資。\n\n━━━━━━━━━━━━━━\n\n🕰 轉機股、價值股、龍頭股、題材股，\n都有人靠它賺到錢。\n\n差別不在標的好壞，\n在它的個性跟我們的時鐘配不配。\n\n龍頭股買的是產業地位，那是已經發生的事實。可以等。\n\n價值股買的是市場一時看錯，錯了總會被修正。也可以等。\n\n題材股買的是資金和情緒，人走了，故事就沒了。等不起。\n\n轉機股最麻煩。\n\n它買的是還沒發生的事。\n\n公司說要轉，市場信了，\n但轉不轉得成，沒人知道。\n\n它跟價值股長得很像，都在低點，都沒人要。\n\n差別是：\n\n價值股是好東西被錯殺，等的是市場回頭。\n轉機股是壞東西說要變好，等的是公司自己爭氣。\n\n一個等別人改變想法，一個等自己改變體質。\n\n⚠️ 後面那個，難太多了。\n\n所以轉機股要先想好：\n什麼情況下我承認它轉不動了。\n\n沒有這條線，跌下來就會一直告訴自己「再等等」。\n\n然後就沒有然後了....\n\n━━━━━━━━━━━━━━\n\n💡 所以我寧可買貴，不要買錯。\n\n買貴的錯，時間修得回來，只要理由還在。\n買錯個性的錯，時間只會把它放大。\n\n買東西\n除了好價格之外，\n別忘了留意保存期限。\n\n━━━━━━━━━━━━━━\n\n🤔 你最近一次虧錢，\n是買錯了東西，還是用錯了時鐘？\n\nA. 買的是龍頭，卻興沖沖的進場，急急忙忙地離開\n\nB. 買的是題材，套了就當長期看好，等待解套。\n\n留言告訴我，我們一起對照看看。\n\n━━━━━━━━━━━━━━\n\n非投資建議。"},{"id":"A20260816-62","type":"研究","title":"老黃開了一條水管，接的是還沒來的水","date":"2026-08-16","series":"","seq":0,"tags":["AI 與半導體","景氣循環"],"gist":"上游在數錢、下游還沒付錢；融資創新讓榮景延長，也讓風險換了位置","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid036JqgA7ZByi7EW4f2o4vk2zsBnvKkZGVnEt1EPaQDgURgAZtM4emXvB8fUKmnUf5Gl&id=61571663936725","body":"【時事】老黃開了一條水管，接的是還沒來的水\n\n老黃這次的說法我很喜歡：AI Factory 就是智慧時代的基礎建設，像電力、像鐵路、像通訊。\n\n這個比喻很漂亮。但漂亮的比喻，值得再往下推一層。\n\n電廠會蓋起來，不是因為蓋電廠很賺錢。\n\n是因為插頭那一端，有人每個月在繳電費。 💡\n\n—\n\n把 AI 這條鏈攤開看，會發現它是有方向的。\n\n算力從上往下走：晶片、伺服器、資料中心，最後變成我們手上會用的東西。\n\n錢從下往上走：有人付費用 AI 寫程式、跑研發、做客服，這筆錢才會一路往上，回到蓋電廠的人手裡。\n\n問題就在這裡。\n\n現在上游已經在數錢了，下游還沒開始付錢。\n\n—\n\n晶片層跟基建層，毛利在循環高點，訂單能見度好到不像話。\n\n但再往下走一層，畫面完全不一樣。\n\nGoogle 在 2026 年第二季，自由現金流轉負。\n\n上市二十二年來第一次。\n\nAmazon 近十二個月也翻負了。Meta 帳上現金一年之內少掉九成，只剩不到八億美元。\n\n四家裡面，現在只剩微軟還是正的。\n\n這不是虧損。它們的本業還是很賺。\n\n這是賺的速度，追不上蓋的速度。 📌\n\n—\n\n所以真正的缺口不在算力，在現金流的時間差。\n\n管線先蓋好了，水還在後面。\n\n過去這一段是誰在補？是四大雲端的資產負債表，是創投的錢，是把股價當抵押品的信心。\n\n但那些水源快到極限了。\n\n老黃這次做的事，是接一條新的水管進來——退休金、保險資金、私募信貸。這些錢的特性是量大、期限長、要求穩定報酬。\n\n要讓這種錢願意進場，你必須先做一件事：\n\n把 GPU 從「三年就歸零的設備」，重新定義成「可以收租的基礎建設」。\n\n所以那句 Compute is revenue，不是廣告詞。\n\n那是一整套資產定義的入場券。\n\n從這個角度看，5,000 億不是一筆錢。\n\n是一個定義。\n\n—\n\n那這個定義站不站得住？\n\n老黃給的證據是 A100——2020 年的卡，到今天還在跑訓練跟推論，經濟壽命可能接近十年。\n\n這句話是真的。但「還能跑」跟「值得跑」是兩件事。\n\n資料中心是一個電力受限系統。舊 GPU 的敵人從來不是壞掉，是每瓦效能。\n\n當新一代每瓦效能翻倍，舊卡就算還能算，占著機房裡那一格電，本身就是虧的。\n\n老黃自己也知道，所以他留了最高 25% 的殘值支持。\n\n這步棋很聰明，但它同時回答了一個問題——\n\n如果算力真的是那麼好的資產，為什麼還需要你來補殘值？ 🤔\n\n—\n\n所以我怎麼看這則新聞？\n\n我不覺得這是泡沫破掉的訊號。\n\n融資工具的創新，通常出現在循環的後段，不是結束。\n\n這件事會讓這輪榮景走得更久，因為它替產業鏈續了一段命。\n\n但它也把風險換了個位置：\n\n原本鎖在幾家科技巨頭資產負債表裡的風險，現在攤開來，接到了退休金、保險、私募信貸上面。\n\n而外部注進來的水，是有利息的。\n\n真正該盯的指標，從此不再只是台積電的月營收，也不是 CoWoS 開多少產能。\n\n是應用層什麼時候開始，真的付得出那張帳單。\n\n我不預測那一天什麼時候到。我只確認一件事：\n\n現在這個季節，子彈比報酬重要。\n\n—\n\n看完這篇，你心裡冒出來的是哪一個問題？\n\nA. 基建總不可能一直蓋吧？樹又不會長到天上\n\nB. 中游現金流都轉負了，錢燒完怎麼辦？\n\nC. 說了半天，AI Agent 到底是什麼？跟我有什麼關係？\n\n（會選 C 的，其實是這題最誠實的答案。因為整篇文章都在說下游還沒開始付錢——而下游，就是我們。）\n\n—\n\n持倉揭露：台積電、台達電、群聯、南亞科、美光、CrowdStrike。本文非投資建議。"},{"id":"A20260816-63","type":"方法","title":"六月我沒有停利，七月我天天回吐","date":"2026-08-16","series":"","seq":0,"tags":["水位與風險","投資心態"],"gist":"改的是條件，不是決心：比重超過目標就賣回原位","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid09WVus6QP585Fbr32Miu2uaBJafeTYBTLANXubhvo3u18jgFYL7q6ZxhvLcPqizqAl&id=61571663936725","body":"六月我沒有停利，七月我天天回吐\n\n最近看到一個股友丟出三個問題，問完我坐在那邊很久。\n\n不是問題多難。是太準了。\n\n一、上半年市場瘋狂的時候，你是一路加碼，還是分批減碼停利？\n\n我沒有停利。\n\n我在數錢。💰\n\n打開App，看一下總資產，關掉。過一小時再打開，再看一次。那陣子我天天在做這件事。\n\n二、六月底爆出超級大量那週，你是減碼，還是繼續用力追？\n\n我什麼都沒做。\n\n我後來才想通，問題不是我沒看出那是高點——高點本來就沒有人知道。\n\n問題是我當時根本沒在看訊號。我在看報酬。\n\n眼睛裡只有數字有沒有變大的時候，量能背離、輪動變窄、成交爆量，這些全部都會變成背景雜訊。\n\n三、七月一整個月崩跌，你在砍股票，還是在觀察加分批買進？\n\n我在等買點。\n\n聽起來很冷靜對吧。但這句話翻譯過來是——我同時也沒有減碼。😮‍💨\n\n由於六月我沒有停利，七月我天天回吐。\n\n想清楚之後我才發現，第三題根本沒有獨立的答案。\n\n前面兩題你怎麼做，決定了第三題你還有沒有得選。\n\n再來一次呢？\n\n我不會說我要更果斷。果斷這種東西，事後看都很簡單。\n\n我要改的是條件，不是決心。\n\n我不判斷高點，我只看比例。\n\n當股票的比重高過我設定的目標，我就賣掉一部分，讓它回到原本的位置。\n\n不用猜，也不需要決心。市場替我決定時機，我只負責照做。\n\n難的地方在於，每一次調整，賣掉的都是當下最會漲的那一檔。不過，漲得正嗨的時候要賣股票，難度跟割肉沒兩樣。\n\n說穿了就是未雨綢繆四個字。\n\n但這四個字最難的地方在於，雨還沒下的時候，你要覺得麻煩。\n\n天氣好得不得了，帳面天天創新高，這種時候誰想去翻傘。☔\n\n可是等到真的下起來，滿地都是甜甜價的那一天——\n\n你還有錢買嗎？\n\n這三題，你最不想回答的是哪一題？\n\nA. 第一題。因為我也沒停利\nB. 第二題。因為我當時真的沒在看訊號\nC. 第三題。因為我到現在還在等買點\n\n以上為個人紀錄與思考，非投資建議。"},{"id":"A20260731-59","type":"方法","title":"自由現金流為負，一定是壞事嗎？","date":"2026-07-31","series":"","seq":0,"tags":["選股與估值","AI 與半導體"],"gist":"拆開營運現金流與資本支出：Google 是有靠山的擴張，Tesla 是背水一戰","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0aPbsgP7QPPipRDsEnYC5cyUYyzk9wqgPg6XSy984DmkYh5oKXDSq3UDBVL3XSNByl&id=61571663936725","body":"最近跌的咪咪帽帽(台)\n要來恢復發文囉~ 一起在股海赴湯蹈火!\n-------------------------------------------\n📉 自由現金流為負，一定是壞事嗎？\n\n老實說，我們自己看到也會緊張。😅\n\n尤其是像Google這種印鈔機，\n第一次看到自由現金流轉負，\n心裡冒出來的念頭也是：\n入不敷出了？\n\n後來我們才想通——\n投資就像播種。\n\n現在把種子撒下去，\n帳面上當然是支出。\n但那是在預約未來的收成。\n\n—\n\n一家公司在擴張期，\n先蓋廠、先買設備、先建置產能，\n收入卻要兩 三年後才進來。\n\n投資跟收入本來就有時間差。\n而且這時候要看的應該是雲端業務收入的增速!\n\n如果沒有融資管道，\n沒有股市讓公司先拿到未來的錢，\n那所有需要長期投入的產業，\n是不是都做不成了？\n\n—\n\n所以自由現金流為負，\n本身不是結論，\n是一個要拆開來看的訊號。🔍\n\n—\n\n第一件事，先看營運現金流本身。\n\n自由現金流 = 營運現金流 − 資本支出\n\n如果營運現金流是正的，\n只是資本支出把它吃掉了，\n這叫投資期。\n\n如果營運現金流本身就是負的，\n那才是真正的入不敷出。\n\n這兩件事天差地遠，\n但財報標題上都寫「自由現金流為負」。\n\n—\n\n最近兩家公司剛好可以對照。\n\nGoogle\n2026年第二季，\n營運現金流391億美元，強勁。\n資本支出449億美元，\n自由現金流首次轉負，-58億。\n\n錢花在哪裡？\n資料中心、TPU、AI算力。\n跟他們的成長引擎完全一致。\n\n而且本業還在成長——\n雲端營收年增82%，營益率從20.7%升到35.6%。\n\nTesla\n同一季，\n營運現金流47億美元，年增85%。\n資本支出57.9億美元，年增142%，\n自由現金流轉負，-10.9億。\n\n錢花在哪裡？\nRobotaxi、Optimus機器人、AI運算、半導體。\n\n但這裡有一個Google沒有的問題：\n汽車交車量創新高，\n營業利益率卻從4.1%掉到1.4%。⚠️\n\n—\n\n同樣自由現金流轉負，\n但這兩家考驗的東西不一樣。\n\nGoogle是「有靠山的擴張」。\n廣告本業這台印鈔機還在穩定產出，\n撐得住資本支出，\n你只要看一件事——\n雲端的高速成長能不能持續。\n它考驗的是耐心。\n\nTesla是「背水一戰的擴張」。\n本業汽車的獲利正在轉弱，\n投資又分散在Robotaxi、機器人、AI，\n而且量產時程還說不準。\n它考驗的不是耐心，是信仰。\n\n—\n\n差別就在這裡。\n\n兩家都是自由現金流轉負，\n兩家都在為未來大手筆投資。\n\n但一家的本業獲利品質還在改善，\n另一家的本業獲利品質正在惡化。\n\n看自由現金流，不能只看正負號。\n要看獲利增速，還要看獲利品質。\n\n—\n\n這也是為什麼同樣一則新聞，\n可以有完全相反的解讀。\n\n有人看到「燒錢」，\n有人看到「卡位」。\n\n差別不在數字，\n在你有沒有拆開來看。\n\n—\n\n還有一個容易被忽略的訊號。\n\nTesla這一季的財報，\n上一季說的「Cybercab、Semi、Megapack 3\n將於2026年量產」——\n這句話悄悄消失了。\n\n有時候，\n時程承諾的語言變化，\n比財務數字更早說話。\n\n—\n\n看到自由現金流轉負，你會怎麼做？\n\nA｜先看營運現金流，判斷是投資期還是燒錢\nB｜看資本支出投在哪，跟核心業務相不相關\nC｜直接減碼，不確定的時候先降低風險"},{"id":"A20260731-60","type":"心法","title":"你上一次覺得「夠了」，是什麼時候？","date":"2026-07-31","series":"","seq":0,"tags":["投資心態"],"gist":"能控制的只有水位；別讓未來的數字偷走現在的感受","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02sHm8t6xX5A2vGDxdSyrXEapnr1q52ajFd4QAXw7dQvXnjMzCjQeaSfMhh3oU255ql&id=61571663936725","body":"這篇寫於今年六月多，台股還在漲不停的時候。\n\n七月底回頭看，突然很感慨。\n\n舒服的時候想著閃崩何時來，結果它真的來敲門了。😅\n\n━━━━━━━━━━━━━━\n\n昨晚看完球，躺著，沒有睡意。\n\n床很舒服，空間很舒適。\n\n腦子沒有在轉，就這樣安靜地想著——有舒服的家，有閒錢可以投資，有時間做自己想做的事。\n\n我還有什麼好奢望的呢？😊\n\n━━━━━━━━━━━━━━\n\n這個當下，值得記錄。\n\n人生無常，未來發生什麼事誰知道。片刻的寧靜與平衡，是隨時會打破的。正因為如此，體會到的時候，就要知道自己正在體會。\n\n━━━━━━━━━━━━━━\n\n然後我想到股票。\n\n股票的漲跌，你無法控制。你能控制的，只有水位的高低。\n\n這件事跟幸福的道理是一樣的。\n\n你無法控制市場什麼時候修正，無法控制閃崩什麼時候來。你能做的，是在寧靜的時候把準備做好，讓那個當下不被打亂。\n\n━━━━━━━━━━━━━━\n\n我把這件事記下來，是想提醒自己一件事：\n\n不要因為追逐報酬，而忽略了生命中的美好。\n\n水位再高一點，倉位再重一點，那些都是未來的事。今晚的這張床、這個安靜的腦子，是現在的事。\n\n別讓未來的數字，偷走現在的感受。\n\n━━━━━━━━━━━━━━\n\n你上一次覺得「夠了」，是什麼時候？\n\n━━━━━━━━━━━━━━\n\n非投資建議"},{"id":"A20260723-58","type":"方法","title":"風險，要用幾何平均數來想","date":"2026-07-23","series":"","seq":0,"tags":["水位與風險"],"gist":"波動會吃掉複利；留在牌桌上，比賺得快更重要","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid025ByFgBnKoLFk4ZXXFWzNU9ySwJzjRgiduETTQ3Go7DUkYAhi1vSebBqnYgDzxWC8l&id=61571663936725","body":"📉 風險，要用幾何平均數來想 📉\n\n算術平均會騙人。(差異可以Google，值得去了解)\n\n漲50%、跌50%，平均等於0，感覺打平。\n但100元漲50%變150，\n再跌50%剩75。\n\n兩年後，你實際虧了25%。\n\n差距從哪來？\n波動本身會吃掉複利，\n跟你賺賠次數無關，只跟每次的百分比有關。\n\n—\n\n2024年7月的急跌，\n讓我第一次真正意識到——\n這不是數學題，是心理題。😔\n\n帳面每天縮水，\n家人在旁邊嘮叨，\n工作還要強顏歡笑。😅\n\n那種壓力跟痛苦，\n理論上算得出百分比，算不出感受。\n事後看沒什麼，當下可是逢人就問台股怎麼了嗎?\n\n—\n\n多數人會高估自己的風險承受度。⚠️\n\n你以為自己扛得住30%的回檔，\n是因為你從沒真正經歷過那個當下。\n\n真正的風險承受力，\n不是理論上算出來的，\n是你實際被清算過才知道的。\n\n—\n\n2024年的那次急跌，\n變成2025年4月的學費。📚\n\n對等關稅那次，\n連續跌停，市場一片恐慌，\n但這次手上還有現金。💰\n\n分批進場建倉，不是因為算得準，\n是因為留有餘裕。\n\n—\n\n配置的意義，\n從來不是追求理論上最高的期望值，\n而是留住選擇權——\n\n讓自己在最差的時刻，\n仍然有能力說「這個我不賣、不追」，\n而不是被迫在最差的價格成交。\n\n—\n\n人生也只走一條路，\n不是無數平行宇宙的平均值。\n\n一次歸零，\n後面複利再高都跟你無關。⚡\n\n—\n\n🔑 留在牌桌上，比賺得快更重要。\n\n看對方向，走穩自己的路。\n\n—\n\n7/17的加權指數最大跌點2953，殷鑑不遠\n你手上還有選擇權嗎？\n我是檢討自己除了順勢交易，也該加入再平衡的停利機制。\n\nA｜有現金，可以說「我不賣、不追」\nB｜滿倉，只能被動接受市場開的價格\nC｜還沒經歷過，不確定自己扛不扛得住"},{"id":"A20260717-56","type":"心法","title":"最大跌點 2953，獲利回吐，然後呢？","date":"2026-07-17","series":"","seq":0,"tags":["水位與風險","投資心態"],"gist":"把重心從未實現損益，移到股票與現金水位","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0X974xaSQ2CrzYu2gGn4fb1RMXxwZRUdK9vwPKXZvGKtCcSa7t4g8i2a4GMAVM1aBl&id=61571663936725","body":"今天加權指數創最大跌點2953，獲利回吐，然後呢？\n\n盤勢震盪的時候，\n最容易做的一件事，\n就是盯著帳面上那個數字，\n看它一格一格往下走。\n\n昨天還是這個數，今天少了一塊，\n明天又少一塊。\n\n那種感覺不是心痛，\n是某種平常感覺不到的東西，\n在很安靜地流失。\n\n—\n\n懊悔開始跑出來了。😔\n\n怎麼沒早點看清局勢，\n怎麼沒在高點減碼，\n如果當時賣掉就好了……\n\n腦子會一直重播那個畫面，\n好像多想幾次，\n數字就能倒轉回去一樣。\n\n但現實沒有後悔藥。\n\n我知道不舒服，這不舒服是真的。\n但我不會停在那裡。\n我向前看，想著下一步該怎麼做。\n\n你不孤單。\n這種心情，每個投資人都經歷過。\n\n—\n\n不過審時度勢本來就是重要的事情。\n\n現在適合買在支撐，不追高。\n\n那支撐破了怎麼辦？\n認輸，等下一個支撐出現。\n\n沒有什麼好留戀的，\n市場從來不欠誰一個解釋，也不會為了誰而停下來。(簡直像極了愛情... 好像這句不流行了~)\n\n—\n\n很多人把重心放在未實現損益的變化，\n漲了開心，跌了難受，\n心情跟著報價板一起坐雲霄飛車。\n\n我後來發現，\n這樣很累，而且沒有用。\n\n我把重心移到兩件事：\n股票水位跟現金水位。\n\n這兩個數字，才是我真正能控制的。📊\n\n—\n\n獲利回吐不是輸，\n是市場在問你一個問題：\n\n你的核心邏輯還在嗎？\n\n如果在，水位控制好，繼續持有。\n如果不在，那才是真正要動的時候。\n\n—\n\n投資這條路，\n不是比誰賺得多，\n是比誰更能堅持下去。\n\n在人聲鼎沸時保持清醒，\n在乏人問津時保持樂觀。\n\n現在是比氣長的時候，考驗誰才能繼續走得下去。\n\n—\n\n帳面縮水的時候，你在看什麼？\n\nA｜盯著未實現損益，心情跟著走\nB｜看水位控制，確認邏輯還在不在\nC｜乾脆不看，眼不見為淨"},{"id":"A20260715-54","type":"心法","title":"槓桿不是能不能開，是在哪個季節開","date":"2026-07-15","series":"","seq":0,"tags":["水位與風險","景氣循環"],"gist":"錢的價格跟該不該用它事與願違；同一筆增貸，季節決定是智慧還是災難","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid036h1WsFmSSTU4Xqrmcpc1FbicQFcWjMFh5dcWV2a3TcU8wAETaVn6eKyPrPj5QDLFl&id=61571663936725","body":"漲到快五萬的那幾天，我觀察沒有人在擔心會不會跌。📈\n\n每個人眼裡只剩一件事——\n我買的，是不是還不夠多。\n\n走到哪都一樣。\n電梯裡、飯桌上、剪頭髮的時候，\n連平常不碰股票的人，都開始問你買了什麼。\n市場很熱鬧。\n熱鬧到你會忘記，冬天也是真的存在過。😅\n\n可是我記得。\n\n2023 年，一萬二的時候，\n新聞每天在講風暴，\n帳面難看，氣氛愁雲慘霧，\n那時候沒人問你買了什麼，\n只問你「還沒跑喔?」\n\n市場的散戶如你我\n指數一萬二的時候怕買錯，\n指數四萬八的時候怕買少。\n\n怎麼從頭到尾都在怕啊?\n只是換了怕的東西。😮‍💨\n\n━━━━━━━━━━━━━━━━\n\n但最冷的一層，不在我們心裡，在銀行的臉上。🏦\n\n一萬二的時候，錢便宜到沒人要，\n借款利率低得可憐，\n可是愁雲慘霧，沒人敢伸手。\n\n四萬八的時候，錢貴了，\n利率高就算了，你想借，還借不到。\n\n你發現沒有——\n錢的價格，永遠跟你該不該用它，是事與願違的。\n\n該重壓的時候，錢最便宜，你不敢。\n最不該加碼的時候，錢最貴，你搶著要。\n\n連銀行，都在陪我們一起，把季節看反。\n\n━━━━━━━━━━━━━━━━\n\n講到這裡，我得老實說。\n\n我也開槓桿。💳\n\n信貸借了現金流還得起的部分，\n長期持股拿去質押，最多能借五成，我先借了四成——\n其中一大塊，還放著沒進場，躺在帳戶裡當現金。\n\n我也怕借不到，我也怕買不夠。\n我不是站在岸上看你們游泳的人，\n我最近也快要溺水了。🌊\n\n但泡在水裡久了，我退後想過一件事。\n\n槓桿這東西，\n不是能不能開的問題，\n是你在哪個季節開的問題。\n\n同一筆房屋增貸，\n壓在一萬二，是智慧；\n壓在四萬八，是災難。😰\n\n━━━━━━━━━━━━━━━━\n\n這陣子很多人在講「四貸同堂」，\n把它當成一種警告，一種嘲諷。\n\n可是我覺得，大家罵錯方向了。\n\n問題從來不是你開了幾貸。\n是你，在幾點開的。\n\n在四萬八，才把最後一道增貸壓下去，\n那不是勇氣，是用最貴的錢去買最少的籌碼。\n\n━━━━━━━━━━━━━━━━\n\n別人恐懼，我貪婪。這句名言大家都耳熟\n\n那為什麼——\n錢最便宜的時候，我們一毛都不敢借?🤔\n\n━━━━━━━━━━━━━━━━\n\nP.S.\n\n四萬點以上還把槓桿開滿的朋友，\n這幾天那種打從心底的懊悔，\n我不用問，也知道是什麼滋味。\n\n因為那個半夜盯著天花板、\n問自己「我到底在幹嘛」的人，\n我也這麼懊悔過。🌙\n\n只是這一次，我學乖了。\n\n（以上是個人紀錄與心得，非投資建議。）\n\n━━━━━━━━━━━━━━━━"},{"id":"A20260715-55","type":"心法","title":"五句話：被迫成交、倖存者偏差、拒絕權","date":"2026-07-15","series":"","seq":0,"tags":["投資心態","水位與風險"],"gist":"拒絕權不是天生的態度，是靠緩衝一格一格買回來的","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02cW2Qu7dVpMGSyAwL7pwhsSmdRhjMeVKmt7q1XtsGJHMD2CBbN5WGMJBVBfZxwuJJl&id=61571663936725","body":"1. 讓你失去平靜的不是波動，是被迫成交——欲望不會清算你，槓桿才會。\n\n2. 沒買到的股票不是你虧掉的報酬，因為你從沒扛過中間的風險，也沒證據你抱得住。\n\n3. 你拿來比較的那個 benchmark，是每天重新編製的倖存者偏差集合，輸給它不代表你差。\n\n4. 多數人以為自己的人生已經分散了，其實工作、收入、同儕地位背後都是同一個因子在驅動：社會認可。\n\n5. 拒絕權不是天生的態度，是靠緩衝一格一格買回來的——先讓自己輸得起，才談得上放得下。"},{"id":"A20260706-52","type":"方法","title":"景氣有四個季節，你現在站在哪裡？","date":"2026-07-06","series":"景氣循環系列","seq":1,"tags":["景氣循環"],"gist":"選股之前，先搞清楚現在是哪個季節","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0odEqyhWA4FW9LdLozYPpmb9QgGrepT4uMhvgpGdQe4K4a4Zk5Dy5GGkVMsmPWqhDl&id=61571663936725","body":"景氣有四個季節，你現在站在哪裡？\n\n多數人選股的方式是這樣的：\n\n看到一個題材，覺得有道理，\n研究一下公司，然後買進。\n\n這個流程沒有錯。\n但少了一個步驟，放在前面。\n\n—\n\n說說我自己幾個丟臉的片段。😅\n\n盤整的時候做順勢交易，\n天天被多空雙巴到懷疑人生。\n後來才搞清楚——盤勢判斷優先於一切，\n在湖中央是沒辦法衝浪的。\n\n記憶體供不應求，數字擺在眼前，\n我視而不見，覺得「這段行情看不懂」。\n後來漲了好幾倍，我才幡然悔悟。\n\n景氣復甦的時候，\n每次上漲都被我當作無稽之彈，\n想等崩盤再進場，\n等阿等  等到花兒都謝了。\n\n三次，三個不同的季節，三種不同的錯法。\n後來我才明白：\n原來不是選股出問題，是我搞錯了季節。\n\n—\n\n季節搞清楚之前，\n技術分析沒用，基本面也沒用。\n\n景氣循環的本質，只有一件事：\n\n需求跟供給的時間差。\n\n需求來得快，供給跟不上，\n大家搶著備貨，價格飆漲，人人喊多。\n\n供給開出來了，需求卻已經降溫，\n庫存堆積，砍單，價格崩跌，人人看空。\n\n矯枉過正，然後再矯枉。\n這就是循環，從來沒有例外。\n\n半導體尤其明顯。\n一座晶圓廠從決定蓋到量產，三到五年。\n需求訊號出現時下決定，\n等產能開出來，市場可能就不是同一個市場了。\n\n—\n\n讓我真正想通這件事的，是台積電。\n\n2023年，台積電毛利率還在下滑，\n我買得膽戰心驚。\n\n但股價就是爬阿爬。\n\n後面的事你知道——\nAI晶片需求爆發，毛利逐季成長，\n當時便宜的價格，再也回不去了。\n\n眼睛看到的是現在。\n投資看的是未來。\n等到毛利漂亮、人盡皆知再進場，\n利潤早就讓別人拿走了。\n\n—\n\n景氣跟天氣一樣，有四個季節。🌱☀️🍂❄️\n\n復甦期——冬天剛過，春天要來。\n市場還在懷疑，數字已經在轉。\n這是買進最好的時機，也是最需要勇氣的時機。\n（我那時候還在等崩盤。）\n\n成長期——春耕夏長，萬物生長。\n股市高貴，但還不算貴。\n這個季節最舒服，也最容易讓人忘記冬天。\n\n榮景期——盛夏，熱到有點不對勁。\n帳面繁榮，但消費支出開始見頂，\n資金輪動加快，雨露不再均霑。\n進場還有機會，但要挑，要輕，要留後路。\n\n衰退期——秋收冬藏，準備過冬。\n不是末日，是季節。\n現金最值錢的時候，\n也是為下一個春天備料的時候。\n\n—\n\n現在是榮景期。📊\n\n就業數字還穩，民間資本支出二度上揚，\n但等到消費支出開始放緩，市場波動會逐漸放大。\n\n數字說的是：\n好日子還在，但不會一直在。\n\n—\n\n知道季節，不是要你停止投資。\n是幫你做一件事：\n\n把對的事，放在對的時間做。\n\n弄清楚季節對了，投資的路上也就不容易感冒了。\n\n—\n\n你上一次判斷景氣位置，是什麼時候？\n\nA｜有在看，這也是我選股前的必要步驟\nB｜偶爾看，但不確定怎麼跟操作連起來\nC｜老實說，都是直接選股，沒想過這一層"},{"id":"A20260625-48","type":"研究","title":"Token 是電，但比電 intelligent","date":"2026-06-25","series":"","seq":0,"tags":["AI 與半導體"],"gist":"瓶頸在哪裡，利潤就在哪裡；中間單純賣電的那層最危險","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02z2JAMcFV5aoa3imrygdCap1oqcu6SPGWTbFZqLaVaZAmJYyUYYWUvUR7nUkmtsmRl&id=61571663936725","body":"⚡ Token是電，但比電intelligent🧠\n\n最近在整理一份框架，\n可以把Token跟電力放在一起看。\n\n電廠比的是發電成本，\n電氣則是用電創造價值。\nToken工廠跟電力工廠一樣，都是基礎設施。\n沒有它們，後面什麼應用都長不出來。\n\n—\n\n把這條產業鏈拆開來看，每一層賺錢的方式都不一樣。\n\n做設備的，賣的是基礎建設本身。\n誰能蓋資料中心，靠的是資本門檻跟通路。\n自己蓋算力的模型商，靠垂直整合拿到最低成本，\n這跟工廠自建電廠是一樣的邏輯。\n\n中間還有一層，\n只負責把算力轉售出去，自己不蓋、不做應用。\n\n這一層最危險 ⚠️\n\n—\n\n如果模型商只是把LLM加電力，轉成Token賣出去，\n這件事本身，沒有護城河。\n\n賣電，誰都能賣。\n所以你會看到，所有模型商都在拚命往應用層擴張——\n推出助理、推出工作流程、推出企業服務。\n\n這不是選擇，是不得不。\n不往上爬，就只能困在賣電這一層，被兩邊夾殺。\n\n—\n\n這裡有一個反直覺的地方 🤔\n\n很多人看到Token降價，直覺反應是：\n這樣不就毛利惡化嗎？\n\n但電力的歷史告訴我們不是這樣。\n電費下降，沒有讓電廠倒閉，\n因為用電普及，用電量漲得比電費跌得快，\n發電工廠照樣賺錢。\n\nToken也一樣。\n過去一年多，售價跌了三成，\n但硬體成本跌了九成多，\n某家模型商的算力毛利，從35%一路衝到70% 📈\n\n跌價跟毛利擴張，從來不是互斥的兩件事。\n\n—\n\n早期電力的瓶頸在銅礦跟變壓器，誰控制就誰有議價權。\n這一波Token的瓶頸，從來不是單一個關卡。\n\n先進製程跟封裝產能卡住了，\nHBM記憶體卡住了，\nRubin架構的被動元件吃緊，\n伺服器功耗暴增需要HVDC撐著，\n再往後看，CPO要應用在Scale up，又是新的瓶頸。\n\n瓶頸不是一個點，是一條接著一條的隊伍。\n\n🔑 瓶頸在哪裡，利潤就在哪裡。\n\n—\n\n整條鏈走下來，最後收斂成一句話：\n\n賣設備的賺，蓋電廠的賺，做成服務的也賺，\n中間單純賣電的那層，兩邊都吃不到。\n\n你的持倉裡，有沒有卡在「中間層」的標的？"},{"id":"A20260625-49","type":"心法","title":"薪水是租來的，資產才是買來的","date":"2026-06-25","series":"","seq":0,"tags":["長期投資"],"gist":"用勞力換薪水，用時間累積財富","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02zTxhKEcXFJaiNTmBFBhE7xw28G6bD2GAKvzHCU48XCY3QNiZTsLUTxoR5L4a1TUxl&id=61571663936725","body":"💰 薪水是租來的，資產才是買來的\n很多人以為財富差距，輸在薪水。\n\n（我以前也這樣想。）\n\n其實更多人輸在：有存錢，但存錯地方。\n───\n勞力換來的薪水，是租約。\n\n你把時間和體力租給公司，每個月領回租金。\n薪水跟體力一起老，財富不會。\n租約總有到期的一天——\n\n人會老，體力會衰，\n\n但錢不會老，還有四隻腳，跑得比你快。\n───\n但資產不等於財富。\n同樣是股票，同樣放了15年——\n\n台積電跟中鋼，差距是34倍。😅\n不是選錯資產類別，\n\n是選錯了讓誰幫你複利。\n───\n還有一種，是包裝成獎勵的陷阱。\n職場裡的某些配套看起來很甜：\n\n薪水、年終、配股，全押在同一間公司。\n順風時，確實甜。\n\n但公司一出事，你是雙輸——\n\n沒了工作，退路也跟著不見了。\n把獎勵領走、資產分散，才是正確用法。\n\n這不是事後諸葛，當下就看得出來，\n\n只是很多人選擇不去看。\n───\n用勞力換取薪水，用時間累積財富。🎯\n追逐金錢的人看帳面，\n\n累積資產的人看十年後。\n兩種心態，最後是兩種人生。\n💬 你現在的存法，算哪一種？\n\nA. 定存為主，安全感第一\n\nB. 有投資，但還沒想清楚放哪裡\n\nC. 也知道，但先顧好眼前再說"},{"id":"A20260619-44","type":"研究","title":"台股有天花板嗎？我從外銷訂單看到的答案","date":"2026-06-19","series":"","seq":0,"tags":["景氣循環","市場觀察"],"gist":"外銷訂單先講話；榮景期不是雨露均霑，是贏者全拿","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid04GZsX4ybRHZ9qtg5fHu57NwRwpqg1AfC3C6nVadzbqj457Nib52CGncfn6BfEhbAl&id=61571663936725","body":"台股有天花板嗎？\n我從外銷訂單裡看到不一樣的答案 📈\n過去我一直想找一個台股的前瞻指標。\n\n後來發現，外銷訂單年增率跟半導體出貨年增率，\n這兩個數字相關性很高，\n而且外銷訂單，通常會先講話。\n\n—\n\n說來慚愧，我也曾經信過天花板 😅\n\n群創過去就在10到20塊來回，\n這次我也是不到20塊就下車了。\n\n看看現在到哪裡？60。\n\n—\n\n現在這兩個指標在說什麼？\n\n外銷訂單年增率，還在上升軌道 ⬆️\n半導體出貨年增率，也還在上升軌道 ⬆️\n加權指數跟著往上，三條線同步往上爬。\n\n數字反轉，通常都還有兩三個月的行情。\n不用自己嚇自己。\n\n—\n\n但這次有一個地方，讓我多想了一下 🤔\n\n過去台股投資人習慣設天花板，\n擔心景氣反轉，喜歡區間操作，\n漲到一個熟悉的價位，先跑再說。\n\n這次我看到的，不太一樣。\n\n主計處對台灣今年經濟成長率的預測，\n從去年底的3.54%，一路上修到9.64%。\n過去的慣性是年初高估，年底下修。\n這次完全反著來。\n\nS&P Global最近重新預測2026年全球經濟成長，\n全球下修 ⬇️ 美國下修 ⬇️ 歐元區下修 ⬇️ 日本下修 ⬇️ 南韓也下修 ⬇️\n\n但台灣呢？\n\n從5.15%，上修到5.64% ⬆️\n\n—\n\n景氣榮景期，從來不是雨露均霑\n\n是贏者全拿 🏆\n\n全球在降溫，台灣在加速。\n這不是運氣好，是供應鏈卡位的結果。\n\n—\n\n這次我的選擇，不是預設立場，\n而是跟著趨勢，追蹤數字，\n看它們能帶我去哪裡。\n\n—\n\n你覺得這次台股，\n還是過去那種「漲多就要拉回」的劇本，\n還是真的不一樣？\n\nA｜還是老劇本，漲多了我先跑再說\nB｜看數字說話，數字沒轉弱就抱著\nC｜相信贏者全拿，重押到底不看數字\n\n雖然都沒人回答我的問題，還是祝大家端午佳節愉快!\n小孩還沒長大的，就一起辛苦點囉~"},{"id":"A20260619-45","type":"心法","title":"AI 泡沫會不會破？沒有答案，也不用猜","date":"2026-06-19","series":"","seq":0,"tags":["水位與風險"],"gist":"要強化的是應變能力，不是預測能力","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0omsGewmTEfY7Vtf2xc3djMLuRpp4v917w6w2mCW6tSnDGir8fV1i93MRN6g3suRil&id=61571663936725","body":"AI泡沫會不會破？沒有答案，也不用猜 🤷\n\n投資群組裡，有人問了一個問題：\n\n美國科技巨頭，現在不只用自己的現金流蓋AI基礎建設，\n開始發債、借錢、開槓桿，加速往前衝。\n\n萬一有一天，\n錢進來的速度，跟不上資本支出的速度，\n會不會跌得比想像中更慘？\n甚至連金融體系都被拖下水？\n\n—\n\n看到這個問題，我的第一個反應是：\nGood News! 會怕就好，\n會怕，代表趨勢還沒走完。\n行情最瘋狂的時候，大家看到的風險只會是我沒賺到怎麼辦?\n隔壁老王都翻N倍了.....\n\n而且現在的AI，\n已經不是「燒錢蓋夢想」的階段。\n連模型商都開始有獲利能力了。\n人們看到Token價格下跌3成，但卻忽視Token成本下降94%。\n\n—\n\n不過，這個問題，我沒有答案，\n我也不需要有答案。\n\n未來的事，沒人能預先知道。\n\n會不會緩跌？會不會引發信用風險？\nCOM風暴會不會重演？\n天曉得。\n\n—\n\n有想像力是好事。\n能想到風險，代表你有在思考。\n\n但沒有想像力，也不是壞事。\n你不知道未來會怎樣，沒關係，\n本來就沒有人知道。\n\n重點從來不是誰猜得準。\n\n—\n\n我能做的，從來不是預測。\n\n是控制現金水位，是部位汰弱留強 💪\n\n不是去猜哪天會崩，\n是確保崩的那天，\n我手上還有子彈，留著的部位也夠強壯。\n\n要強化的是緊急應變能力，\n不是強化未來預測能力。\n\n—\n\n下一次股市大跌，\n你準備好的是「猜對」，還是「應變」？\n\nA｜我在等一個訊號，告訴我什麼時候要跑\nB｜我不猜，現金水位跟持股品質都顧好了\nC｜還沒想過，先過了今天再說"},{"id":"A20260617-42","type":"研究","title":"當 AI 需要更多記憶體：一個工程師從懷疑到相信","date":"2026-06-17","series":"","seq":0,"tags":["AI 與半導體"],"gist":"KV Cache 與雙重乘數；Jevons 悖論；要等的訊號是供給大於需求","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid06hmyV7rBoRzq6XBhuuGKBKPrJs6MTQEpKDHey2FYxxZxP7Mkz8qows9VGbE2o4Y9l&id=61571663936725","body":"【當AI需要更多記憶體：\n    一個工程師從懷疑到相信的推導過程】\n\n我做品管出身，有個習慣：不相信說明書，只相信數據。\n\n當鋪天蓋地的討論AI帶動記憶體需求，我的第一反應不是興奮，是懷疑——\n\n「這是行銷術語，還是物理事實？」\n\n花了一段時間把技術層和供應鏈層拆開來看，得到一個讓自己意外的結論。\n\n━━━━━━━━━━━━━━\n\n🔩 先搞清楚AI需要的是哪種記憶體\n\n很多人把記憶體當成一個詞，但AI基礎設施裡的記憶體，其實是一個分層架構：\n\n最熱層是 HBM（高頻寬記憶體）——直接貼在GPU旁邊，速度極快，3.35 TB/s，但最貴、容量最小，一顆H100只有 80 GB。\n\n往下是 CXL DRAM、NVMe SSD，各自扮演不同的溢出角色。\n\n每一層，在AI時代都有爆炸性的需求成長。\n\n━━━━━━━━━━━━━━\n\n🔁 為什麼記憶體從配角變主角\n\n2022–2023年，ChatGPT問世，市場瘋搶GPU。記憶體是配角——訓練完模型，記憶體的角色就結束了。分析師的模型也建立在這個前提上。\n\n但2024年之後，模型要部署給數百萬人使用，出現了一個關鍵的物理機制：KV Cache。\n\n用白話說：Transformer架構在產生每個字的時候，都要「回頭看」之前說過的所有字——這些「回頭看的紀錄」，就存在HBM裡，叫做KV Cache。\n\n具體數字：\n\n1,000 tokens的對話 → KV Cache約 0.5 GB\n128,000 tokens的長對話 → KV Cache約 64 GB\n一顆H100 GPU只有 80 GB HBM\n\n當Context Window從4K擴大到128K，KV Cache的需求暴增128倍。\n\n我第一次看到這個數字，以為是行銷誇大，自己算了一遍才發現：這不是預測，是高機率的未來。\n\n━━━━━━━━━━━━━━\n\n⚡ 雙重乘數效應——\n分析師只建模了一個乘數\n\nGPU出貨量每年增加，這件事市場都在算。\n\n但同時，每一代GPU內建的HBM含量也在快速增加：\n\nH100 → 80 GB\nH200 → 141 GB\nB200 → 192 GB\nRubin → 288 GB+\n\nGPU出貨量增加 × 每顆GPU含HBM量增加 = 雙重乘數效應。\n\n這個乘數我找了很久，才發現分析師的模型根本沒建進去——他們只算了出貨量，沒算每顆含量的同步提升。這就是為什麼記憶體財報每一季都超預期。\n\n━━━━━━━━━━━━━━\n\n🤖 Agent時代，需求再升一級\n\nAI Agent需要跨對話的「持久記憶」——不只是當次對話的KV Cache，而是跨session的長期狀態。這帶動了CXL記憶體和企業級NVMe SSD的全新需求。\n\n每一個AI發展階段，都在為記憶體需求設定新的天花板。\n\n━━━━━━━━━━━━━━\n\n🔄 最反直覺的部分：這不是景氣循環，是Jevons悖論\n\n記憶體產業有40年的週期歷史——需求強→廠商擴產→供過於求→價格崩跌。很多人用這個框架看AI記憶體，覺得「炒過了就會崩」。\n\n但歷史上一再發生一個現象：當一項技術的效率大幅提升、成本大幅降低，需求不減反增——因為更便宜的技術會創造以前不存在的使用場景。\n\n這叫Jevons悖論。1865年，英國經濟學家發現蒸汽機效率提升後，煤炭消耗不減反增，因為更便宜的能源催生了以前不可能存在的工業。\n\nDeepSeek發布那天，市場說GPU需求要崩。我自己也愣了一秒。然後想通了——推論成本降低10倍，代表可以部署10倍多的AI服務，每一個部署都帶著KV Cache的物理需求。Jevons的人，反手加碼。\n\n算力越便宜，需要的記憶體越多，不是越少。\n\n━━━━━━━━━━━━━━\n\n👁️ 我在等的訊號\n\n這個方向判斷有明確的邊界條件：記憶體供給大於需求的時刻。\n\n目前還沒看到。SK Hynix、Micron、Samsung三大廠的擴產速度，仍然追不上HBM的需求增速。供給端擴產公告密集出現的那一天，才是我重新評估的時機。\n\n在那個訊號出現之前，方向不變。\n\n━━━━━━━━━━━━━━\n\n投資這個題材，需要的不是「相信AI會繼續發展」的信仰，而是持續監測CSP資本支出指引、廠商擴產公告、HBM良率新聞的紀律。\n\n物理不說謊，但行銷會。\n\n━━━━━━━━━━━━━━\n\n本人持有美光、群聯、南亞科部位。本文為個人研究分享，非投資建議，投資決策請自行判斷。"},{"id":"A20260617-43","type":"方法","title":"鳳凰飛更高，跟麻雀變鳳凰，不是同一種賭注","date":"2026-06-17","series":"","seq":0,"tags":["選股與估值"],"gist":"讀資本支出強度；已知與未知的權重決定持有節奏","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02v2miFBrNn9WZXy6Vvgtz2eM8HcT67T1gGmN7CfnY4wt5pSeJR81Cpzw6fkpLauWVl&id=61571663936725","body":"## 鳳凰飛更高，跟麻雀變鳳凰，\n不是同一種賭注\n\n我兩種錯都犯過。\n\n台光電700塊、奇鋐600塊，我都賣飛過。不是故事不好，是我壓根沒讀懂故事，只看股價在動就跟進，賺了價差就走。那不叫投資，叫搭順風車——台北到高雄的高鐵，才剛到新竹，我就沾沾自喜地跳下車了。\n\n鈊象是另一種錯。ROE漂亮，我以為可以安心等。等了一年才想通：可以等，跟有東西在等你，不是同一件事。\n\n所以現在我看台積電跟台達電，先讀估值的底層語言。\n\n台積電每賺100元，要把35元留在廠房裡。台達電同樣賺100元，只投回8元。市場給台積電打折、給台達電溢價，不是偏心，是在讀資本支出強度。學會讀它，才能比較兩家「都很強」的公司，到底強在哪裡。\n\n然後AI來了，兩家走向不一樣。\n\n台積電是鳳凰飛更高——N2、CoWoS，路早就畫好了，財報只是確認進度。台達電是麻雀變鳳凰——五十年的電源技術，第一次遇到讓它完整放大的場景。GPU功耗從33kW跳到110kW，2026年EPS成長67%，台積電是36%。\n\n但兩種故事，要配不同的心理準備。\n\n鳳凰飛更高，方向確定，主要工作是等。台積電本益比22–25倍，擴產、良率、客戶鎖定全部已定價，唯一的未知是漲價——漲了是驚喜，不漲也不跌。\n\n麻雀變鳳凰，台達電每季財報都是考試。HVDC何時成為主流？毛利率40%能守住嗎？台達電的彈性更大，但每季都要重新確認故事還站不站得住。\n\n主動投資的本質，\n是巧妙的處理已知與未知的權重。\n\n兩種節奏，沒有好壞。要命的是拿錯了標的，用錯了節奏。\n\n━━━━━━━━━━━━━━\n\n你現在手上的股票，是哪一種？\n\n🅐 鳳凰飛更高——我知道方向，我在等\n🅑 麻雀變鳳凰——我每季都在重新確認故事\n🅒 說實話，我之前從來沒想過這件事\n\n━━━━━━━━"},{"id":"A20260614-41","type":"心法","title":"知道是回調，心裡還是痛","date":"2026-06-14","series":"","seq":0,"tags":["投資心態","水位與風險"],"gist":"跌得比應變措施快；減碼計畫要寫得更明確","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02w7tr56T1Y7Lm7LBfBm71NcZFcxKDgrzNVz8gPxetNHgLT8NaRXNh6kzN7KYrq4Sfl&id=61571663936725","body":"📉 知道是回調，心裡還是痛\n\n這週加權指數來回震盪將近3000點，\n收週線小跌2%。\n\n帳上數字跟著坐了一趟雲霄飛車——\n從高點回撤16%，這幾天縮到10%。\n\n😮‍💨 說真的，這次有點猝不及防。\n跌下來的速度，比我準備的應變措施快。\n\n✅ 紀律停損冷靜地執行了，也一併汰弱留強，\n但也讓我反思，如果減碼計畫更明確，這趟雲霄飛車會不會沒這麼晃？\n\n回頭想想，台積電的建廠規劃還在，\nCSP的擴張需求不變，這是漲多之後的回調，不是基本面崩壞。\n\n🧠 道理我都懂。\n\n但看著帳上獲利一路回吐，\n知道是一回事，\n看到錢錢離我而去，心理又是另一番滋味。\n晚上吃飯就泡麵充饑了事吧~\n\n這次回彈回去了，\n但修正還會再來。\n\n下次，我們會做得更好嗎？\n\n—\n\n這週你心裡的聲音，比較接近哪一種？\n\nA.「早就知道會這樣，但應變措施還是不夠快」\nB.「邊看邊想，下次要把計畫想得更細」\nC.「乾脆不看了，看了也只是讓自己更難受」"},{"id":"A20260609-39","type":"研究","title":"CrowdStrike：為什麼這個護城河會愈建愈寬？","date":"2026-06-09","series":"","seq":0,"tags":["AI 與半導體","選股與估值"],"gist":"資料累積優勢：單一感測器、帶標籤資料、跨客戶網路效應","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid09eMyRgk9uydW5vUUUVo2QCdXWoiu7WGwYhoHggTbPXiMRNbsmGfs64B8Wa2QefXCl&id=61571663936725","body":"【CrowdStrike｜為什麼這個護城河，會隨時間愈建愈寬？】\n\n2024 年 7 月，CrowdStrike 推了一個有問題的更新，850 萬台 Windows 裝置同時藍屏。航班停飛、醫院停診、銀行當機——幾乎所有你以為最穩定的地方，同時停擺。\n\n我看到的不只是危機，\n原來一家網路公司出的小紕漏，會讓整個實體世界天下大亂。\n\n這讓我對這家公司好奇，為什麼全球關鍵基礎設施都選擇依賴它？\n\n真正的答案，要從底層看起。\n\n━━━━━━━━━━━━━━\n\n🔩 第一層：單一感測器，資料礦場的入口\n\n每台受保護的裝置只裝一個輕量感測器（Falcon agent），所有安全事件全部流進同一個地方——Threat Graph。每天超過 6 兆個信號，來自全球數百萬台裝置，從攻擊者第一個動作到最終有沒有突破防線，每個細節都被記錄、標記、歸類。\n\n單一入口不是工程上的簡潔，是商業設計——確保資料不分散、不遺漏。這是整個護城河的起點。\n\n━━━━━━━━━━━━━━\n\n🏷️ 第二層：帶標籤的資料，AI 才能學得準\n\n多數公司都有海量資料，但 CrowdStrike 的資料結構不一樣：每一筆記錄都帶著真實結果——這個攻擊手法，最後有沒有突破防線？這個異常行為，事後是威脅還是誤報？\n\n有了這些標籤，AI 才能以機器的速度大量學習，分清楚真正的威脅前兆與雜訊。傳統資安公司靠人工更新病毒定義，一個月的工作量，CrowdStrike 的 AI 幾小時內消化完。\n\n━━━━━━━━━━━━━━\n\n🌐 第三層：網路效應—— 一間客戶受害，全部客戶受益\n\n在 A 客戶偵測到的新攻擊，幾分鐘內推送防護給所有客戶。第一個遭遇攻擊的受害者，反而保護了全球其他用戶。客戶越多，每個客戶受到的保護越強。\n\nSentinelOne 架構相似，卻無法複製這一點——客戶規模不夠，看到的攻擊樣本就少，防護推送就慢一拍。領先者的優勢不是隨時間收斂，是隨時間發散。\n\n這不是商業策略，是物理現象。\n\n━━━━━━━━━━━━━━\n\n📊 第四層：三件事加在一起，才看得懂財務結構\n\nAI 偵測越準，誤報率越低，每個客戶的服務成本隨時間下降。超過六成客戶同時使用 5 個以上模組，每啟用新模組幾乎不需要額外部署——感測器早就裝好了，資料早就在流。\n\n成本往下，定價能力往上，兩條線交叉的時間點，比任何同儕都早。\n\n━━━━━━━━━━━━━━\n\n🔧 工程師的直覺驗證\n\n品管的第一原則：資料的品質，由收集方法決定。\n\n單一入口、統一格式、帶結果標籤——這是做過量測系統的人都懂的設計邏輯。資料分散、格式不統一，模型再強也只是在處理雜訊。\n\n還有一件事值得說：Falcon agent 不是裝在 Windows 上面，是嵌進 Windows 核心層運作。嵌得這麼深，才看得到所有威脅；也正因為嵌得這麼深，客戶換掉它的代價極高。\n\n護城河的深度，跟這次災難的規模，是同一件事的兩面。\n\n━━━━━━━━━━━━━━\n\n⚠️ 我還在擔心的事\n\n藍屏事件後，許多企業要求人工審核才能推送更新，即時防護的速度優勢受到了結構性限制。信任的修復需要時間，新客戶獲取的速度、舊客戶加深使用的程度，我還在觀察。\n\n━━━━━━━━━━━━━━\n\nCrowdStrike 的競爭優勢，根本上是一個資料累積優勢：單一感測器確保資料完整進來，帶標籤的真實結果讓 AI 學得準，規模帶來跨客戶的網路效應。三件事合在一起，成本結構隨時間改善，定價能力隨時間提升。\n\n這不是靜態的競爭優勢，而是一個時間站在它那邊的結構。\n\n━━━━━━━━━━━━━━\n\n本人持有 CRWD 部位。本文為個人研究分享，非投資建議，投資決策請自行判斷。最近漲不少了，但是趨勢沒有改變"},{"id":"A20260608-36","type":"研究","title":"AI 軍備競賽，拼的根本是誰口袋深","date":"2026-06-08","series":"","seq":0,"tags":["AI 與半導體"],"gist":"撐到 AI 真正賺錢那天的，是現金最厚的","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid023Tc8swBSdQxxDMfBuazLj1rCEWgAHHvAxLfnD9M97YuxafBFBT5ktUp9kuMfSFV8l&id=61571663936725","body":"【AI 軍備競賽，拼的根本是誰口袋深 💰】\n\n我有個毛病，每次看到新題材，\n第一反應不是看財報，是去研究技術原理。\n\nAI 這波也一樣——訓練架構、推論效率、各家模型差異，讀完一大圈，才猛然發現我在看賽馬的腿，忘了看賠率。\n真正的戰場，從來不在技術，在口袋深度。\n━━━━━━━━━━━━━━\n\n💵 NVIDIA 最爽\n用自己賺的現金（一年自由現金流約 966 億美元）就能包下產能，完全不用借錢。\n\n📉 反觀三巨頭\nGoogle、Amazon、Microsoft 資本支出全部爆衝，2026 年動輒砸 1,800～2,000 億美元。\n\n結果自由現金流被燒光、紛紛轉負，只好瘋狂借錢、發股票，甚至把債務偷偷塞到「表外」（SPV、私募信貸、GPU 抵押那些招），帳面才不會太難看。\n\n━━━━━━━━━━━━━━\n\n🔋 晶片戰局怎麼走？\n\nNVIDIA 在「訓練」還是穩坐龍頭，但「推論」正被各家自研晶片（Google TPU、Amazon Trainium…）一口一口啃下來。\n\n最穩賺的其實是背後默默設計晶片的 Broadcom 跟 Marvell——賣鏟子的永遠不虧 😎\n\n━━━━━━━━━━━━━━\n\n🔄 最妙的是「循環融資」\n\nNVIDIA 投錢給 OpenAI\n→ OpenAI 找 Oracle\n→ Oracle 回頭買 NVIDIA 晶片\n→ 錢繞一圈又變回 NVIDIA 的營收\n\n有人喊泡沫，NVIDIA 說這是真需求，目前還沒個定論。\n\n━━━━━━━━━━━━━━\n\n💪 一句話收尾\n\n這場長跑，能撐到 AI 真正賺錢那天的，\n不一定是技術最強的，\n而是現金最厚的。\n\n━━━━━━━━━━━━━━\n\n⚠️ 圖表數據含財報實績與分析師預估，僅供參考，投資請自行判斷。"},{"id":"A20260607-35","type":"盤感","title":"這是一個難熬的週末","date":"2026-06-07","series":"","seq":0,"tags":["投資心態","市場觀察"],"gist":"費半單日跌 10%：長線部位不動，追高部位伺機減碼","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02eG8spcJmqj54gEL4d5wqLb4vvmenKJ5FRWkD6TnGA3wVckJ6AjHBiE5x489baNsQl&id=61571663936725","body":"這是一個難熬的週末\n\n週五費半史無前例的10%跌幅\n台指期夜盤一度跌停，後續收下跌3000點\n\n難受的是一種無能為力的窒息感\n你想逃，無處可逃，\n你想給我個痛快吧，等週一開盤...\n\n週一大跌在即，恐怕不是一天而已\n局勢如何變化，仍是要看美股臉色\n\n改變的是股價，跟人們的情緒\n不變的是AI的需求，台積電的建廠規劃\n輝達的Vera Rubin mass production\n\n把週線拉遠一點，你會發現趨勢還在\n真的要跌，你不會賣不掉，\n—— 只會捨不得\n來都來了，長線的部位不動，\n追高的部位伺機減碼，\n剩下的就擦乾眼淚迎接甜甜價囉！"},{"id":"A20260604-29","type":"研究","title":"2026 年 AI 軍備競賽的財務真相","date":"2026-06-04","series":"","seq":0,"tags":["AI 與半導體"],"gist":"四大雲端自由現金流轉負，募資策略分化；錢流向 NVIDIA、台積電","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid031F4jrAxYWEcq4DZtaqK68idagMVGK3v64vosxCcuaNpHQJwbRehzq7dTDroRUc5il&id=61571663936725","body":"【2026年 AI 軍備競賽的財務真相】\n\n四大超大型雲端業者今年全部 FCF 轉負——\n投資超過賺的錢，必須靠外部募資填補缺口。\n\n▌造血能力（OCF）排名：\nAlphabet $174B > Amazon $149B > Meta $116B >> Oracle $24B\n\n▌但 2026E CapEx 全部超過 OCF：\n→ 四家合計 FCF 缺口約 $960 億美元\n\n▌募資策略大分化：\n- Alphabet：募 $170B，是缺口的 15 倍 → 預儲 2027 彈藥\n- Amazon：募 $15B，只覆蓋缺口 30% → 燒現金儲備\n\n這筆錢，大部分流向哪裡？\nNVIDIA、TSMC、以及 AI 供應鏈。"},{"id":"A20260602-27","type":"研究","title":"AI 這波半導體循環，跟以前哪裡不一樣？","date":"2026-06-02","series":"景氣循環系列","seq":3,"tags":["AI 與半導體","景氣循環"],"gist":"趨勢是真的，循環也是真的；關鍵少數的定價邏輯不一樣","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0s56QWafiyRQwnRqn5JceVnfQnMzp4oJ3ReXzhd4FaqrxwrhseANqb6ms3wcWJw4gl&id=61571663936725","body":"AI這波半導體循環，跟以前哪裡不一樣？\n\n過去三十年，\n我從沒感受過進步這麼快的節奏。\n生成式AI才橫空出世，可以跟你畫虎蘭。\n隔年就開始思考，推理，減少幻覺。\n今年小龍蝦爆紅，AI Agent貢獻實質生產力。\n每一個階段，都在打開上一個階段\n想像不到的可能。\n\n商業模式已經展示給你看了，\n不是在賣夢想，是真的在發生。\n\n—\n\n說來可笑，分享一個自作聰明的買賣\n記憶體我太早進場，\n等到推理模型真的需要大量記憶體，\n我反而不相信了。\n還好沒去放空，\n不然就要多打幾份工來還債了...QQ\n\n一朝被蛇咬，十年怕草繩啊！\n\n—\n\n你有沒有這種感覺——\n新模型剛推出，驚艷字字珠璣，\n用心深聊之後，開始話不投機。\n\n不是AI變笨了，也不是你變聰明了。\n是太多人在用，算力不夠分給我們了。\n\n我們是熟悉用Google搜尋的年代，\n關鍵字下得精準與否，\n關乎找不找得到答案。\n\n現在換成聊天機器人，\n很多問題直接解決，\n不用再一頁一頁翻搜尋結果。\n\n這個改變，你我都親身感受過。\n而且現在的滲透率還偏低，\n代表大多數人還沒開始用，\n這條路，還很長。\n\n但資源就是不夠。\n\n算力不夠，記憶體不夠，\n不是AI沒有能力，\n是需求遠遠跑在供給前面。\n\n限制這波發展的瓶頸，\n不是想像力，是算力。\n\n好像只要有電，\n就有無限的需求可以承接。\n\n—\n\n懷疑的聲音當然也有。\n\n一些還沒有獲利的公司，\n股價已經飛上天，\n會不會太貴了？？？\n\n後來想通一件事情：\n這些公司有一個共通點，它們都是關鍵少數!!\n\nEUV機台全球只有ASML在做，\n先進封裝台積電卡住了，\n大功率的CW laser能做的就一兩家，\n你說貴，但你繞不過去。\n\n關鍵少數的定價邏輯，\n跟一般公司不一樣。\n\n—\n\n半導體的循環本質沒有變，\n需求跟供給的時間差，永遠存在。\n\n但這次的需求不是換機潮，\n不是某個單一應用說完就完，\n是一個還不知道自己邊界在哪裡的技術，\n持續在找下一個問題來解決。\n\n不知道什麼時候結束，\n反正上路就繫好安全帶，路上小心囉！\n\n—\n\n這波我選擇相信，\n但還是維持充足的現金水位，\n\n趨勢是真的，循環也是真的，\n兩件事發生的順序有別而已。\n\n你怎麼看這波AI浪潮？\n\nA｜哪次不一樣？炒股啦\nB｜相信趨勢，但控制水位等回調\nC｜買就對了，錢不夠用。"},{"id":"A20260529-25","type":"方法","title":"下跌的時候，你在做什麼？","date":"2026-05-29","series":"","seq":0,"tags":["投資心態"],"gist":"照趨勢做該做的事：追突破、補支撐、反轉就降部位","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02G7VqtdMqRywBRfXrCLeqwYBzfYn3F3H4EcrfvYZchHk1yNg1xTPxX9YdtJK1CSUXl&id=61571663936725","body":"下跌的時候，你在做什麼？\n\n這週加權指數從40000漲到45000，\n再跌回43000。\n\n股民想要報酬，又有如驚弓之鳥，\n指數隨著美伊和談與衝突的須臾起舞。\n\n原來心跳跟持倉部位，\n都會七上八下阿！\n\n股友們剛離職文滿天飛，\n又馬上改口發我想上班的道歉文...\n\n可笑的是這樣的轉折在這幾天內反覆上演\n\n—\n\n股市這種東西，\n讓人既期待，又怕受傷害。\n\n我這週不敢看帳戶，\n漲了覺得「哼，又想騙我」\n好不容易相信這次不一樣，是真的，\n勇敢追，這次不會被套了吧！\n結果哪次不一樣... QQ\n\n—\n\n不過，\n下跌的時候，就做該做的事\n\n從週線看，大盤仍在上升趨勢，\n聾來看，把螢幕拉遠一點，\n阿嬤都看得出來。\n\n敢追突破，跌破就停損，不拖。\n想做波段，支撐補部位，不慌。\n趨勢反轉，降低部位，不戀棧。\n\n美伊歹戲拖棚，曲折離奇，峰迴亂轉，\n都不是買賣的理由。\n\n—\n\n明天漲跌天曉得？\n買進原因我知道。\n\n你怎麼做？"},{"id":"A20260526-24","type":"方法","title":"現在是榮景期，但這不是你想的那種好消息","date":"2026-05-26","series":"景氣循環系列","seq":2,"tags":["景氣循環","水位與風險"],"gist":"榮景期是好過頭；降低持股不是悲觀，是買保險","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0sTov8jer5BpQT9AfRPrGwtfaoBPXt9qVyiSDrPpbLjXoW69d1YhVPA4367Drsmo3l&id=61571663936725","body":"現在是榮景期，但這不是你想的那種好消息。\n\n股市一直漲，去哪吃飯都能聽到隔壁桌的明牌。\n企業法說樂觀，新聞說景氣強勁。\n這種時候，大多數人的感覺是：\n好想歐印，好想買進熱門股，給我股票，其餘免談。\n\n但榮景期有一個沒人想聽的真相。\n\n—\n\n榮景期是景氣擴張最迷人的時期。\n\n每個數字都漂亮：\n民間投資熱絡，固定資本持續增長，\n就業市場穩健，消費者信心高昂。\n\n迷人，正是它最危險的地方。\n\n因為這種增長的背後，是透支出來的。\n\n消費者在用未來的錢過現在的日子。(你股票上漲的時候，不會小薯變大薯，便當加滷蛋嗎?)\n企業在用樂觀情緒合理化過度投資。\n市場的投機性正在悄悄竄升，But Nobody Cares!\n講出來還怕被笑…\n\n榮景期的定義，不是「很好」，\n是「好過頭了」，是好到無法持續下去。\n\n—\n\n這個時期股市有三個特徵同時出現：\n\n本益比站在多年新高。\n股票殖利率相對偏低。\n投資人眼中只有獲利，沒有看到風險。\n\n換句話說：\n你買到的每一塊錢獲利，都比以前貴。\n你承擔的每一分風險，都比以前高。\n但市場的感覺，卻是前所未有的好。\n\n—\n\n所以榮景期正確的操作，只有一條：\n\n降低持股，不是悲觀，是買保險。\n\n上漲過程持續降低水位，維持50%左右。\n把犧牲的那部分報酬，當成必要的保費。\n大跌的時候，才有底氣逢低大買。\n\n就算之後腰斬，你還有子彈。\n有子彈，才有資格參與下一個復甦期。\n\n榮景期不是不能賺，\n是要在最迷人的時候，\n保持最清醒的頭腦，在喧囂的派對結束之前，從容的主動離開。\n\n—\n\n榮景期，你現在的狀態是哪一種？\n\nA｜非常清醒。因為股票都太貴了，不敢進場。\nB｜有點暈眩。賺錢的感覺真好，我還要更多部位~\nC｜完全沉浸。風險？之後再說，離職信已經寫好。"},{"id":"A20260522-23","type":"盤感","title":"指數歷史高點，VIXTWN 好恐慌？","date":"2026-05-22","series":"","seq":0,"tags":["市場觀察"],"gist":"指數高、台指 VIX 也高：大戶已買保險，資金尚未撤退","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02p1jdNE5ZsQs6erBwhpgFE8XFhUyGNCeeczfPuRiDfCYngCVqgT8Xwgq7XJabZ3TRl&id=61571663936725","body":"指數歷史高點，VIXTWN 好恐慌？(台股選擇權波動率指數)\n\n台股 42,000 + 標普VIX 18 + VIXTWN 35+\n這三個數字同時存在，不正常。\n\n正常的邏輯是：指數高，VIX 低，三者方向一致。\n但現在 VIXTWN 已經越過恐慌閾值，標普 VIX 卻沒有跟進。\n\n這代表的不是全球系統性恐慌，是台灣市場內部的緊張。\n\n我的看法：法人在高點大量買 put 保險，但還沒有人先賣股。選擇權兩側都在交易，波動率被同步推高。\n\n換句話說——消防車已在路口發動，但還沒人喊失火。\n\n台股居高思危，亞洲能源危機，資金還在場內追高。FOMO 跟避險同時發生，這才是這波詭譎的地方。漲的時候怕沒跟到，跌的時候怕來不及跑，兩種情緒同時存在，波動率自然壓不下來。\n\n順勢交易者，波動率高的時候應該降低部位。\n左側價值派，創新高會是買點嗎？\n\n後續看兩件事：VIXTWN 能否收斂向下，以及美伊歹戲何時落幕。\n\n目前結論：資金尚未撤退，但大戶保險已買。\n\n——\n\n你現在的部位，準備好了嗎？\n\n　A｜有，保留了足夠的現金水位\n　B｜沒有，失火了再說啦~\n　C｜沒有，師法大戶買保險"},{"id":"A20260520-22","type":"心法","title":"跌不可怕，可怕的是先給你希望，再讓你絕望","date":"2026-05-20","series":"","seq":0,"tags":["投資心態","水位與風險"],"gist":"下跌途中最難的是懷疑自己；依計畫調節現金水位","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid0ZeMWetbYuw8cqEHPxMrYkWxsiJVqC9NNv89DFbRBkAjjG5bCTjv2GXpNgrKfY2gjl&id=61571663936725","body":"[跌不可怕，可怕的是它先給你希望，再讓你絕望。]\n\n3月5日，我在日誌裡寫下這段話：\n\n「從現況研判，戰局對美國有利，持久戰的機率較低。若美股跌破支撐，就先減碼因應。」\n\n邏輯清楚，計畫完整。\n那天的我，是冷靜的。\n\n—\n\n我在VIX降到20的那天進場，把剩下的部位打滿，\n兩天後VIX從20飆回35。\n納指跌破盤整區間，跌破支撐，最後連年線都守不住。\n事後確認3/5就是戰爭期間的最高點。(人道走廊…)\n\n雖然心有不甘，而且不想認輸，跌破支撐後台美股同步減碼，買入反向部位對沖。\n但那段時間，我睡得並不好。\n\n因為市場不是一路打你打到底。\n\n它先讓VIX降溫，讓你覺得最壞的時候過了，\n讓你帶著邏輯、帶著信心進場，\n然後繼續跌。\n\n先給希望，再讓你失望。\n這比直接一路下跌還要虐心。\n\n跌10%不是問題，從高點修正20%也不是問題。\n問題是下跌途中，\n你開始懷疑的不是市場，是自己的判斷。\n\n—\n\n後來停火曙光出現，大盤暴力反彈。\n支撐站回來之後，我按照紀律買回停損的部位。\n\n事後諸葛，像是白忙一場。\n\n但事前哪知道反彈是否發生？\n\n唯有依計畫調節現金水位——\n跌的時候有錢買，\n漲的時候付出一點保費。\n\n我們不用當暴發戶，\n要當常勝軍。\n\n—\n\n減碼之後市場反彈，\n你是鬆了一口氣，還是懊悔減太多？\n\nA｜鬆了口氣。至少睡得著覺了\nB｜懊悔。早知道繼續凹單就好，本多忠勝阿\nC｜兩個都有。理智說計畫對，情緒說少賺了"},{"id":"A20260513-21","type":"心法","title":"你今天賣飛了沒？","date":"2026-05-13","series":"","seq":0,"tags":["投資心態"],"gist":"賣飛是能力邊界的標記；好了傷疤，忘了痛","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid037hz11vxqbWmhujQMBqU4XMDXkqhXuTi9ddY6VoWLfuwJi7DNqQeKad437tj4i58gl&id=61571663936725","body":"【你今天賣飛了沒?? 】\n\n我發現，最近投資朋友的打招呼方式變了\n\n行情初期：「恭喜啊，23XX大賺喔！」\n行情到現在：「唉，台光500賣了，怎麼已經5000了？」\n\n從喝采變成怨嘆，\n從「你賺到了」變成「我賣光了」。\n\n每個投資人都有一張賣飛清單。\n那個數字，像根刺，卡在喉嚨——\n比虧損更難受，因為它會永遠是你不可能實現的獲利~\n\n但我想問一個更值得想的問題：\n\n你當時為什麼賣？\n\n不是替自己找理由，\n是因為答案就藏在這裡。\n\n研究不夠深，抱不住。\n部位太小，漲了反而焦慮。\n沒有計畫，漲一點就想落袋。\n\n每一隻賣飛的股票，\n都可以是成長的養分，\n也可以是自己能力邊界的標記。\n\n有些股票就是弄不懂，抱不住。\n那也沒關係——\n巴爺爺一輩子不碰科技股，\n也沒人說他不會投資。\n能力圈之外的東西，放走就放走了。\n\n馬年行情如萬馬奔騰，\n股票好像只漲不跌，\n恨不得歐印+質押+信貸+增貸! 彷彿部位持有越多越好。\n\n還記得去年在跌的時候，\n心裡想的是”我持有這麼多部位，有病嗎?”\n\n舉幾個親身經歷吧\n力旺殺到1500，那個下跌的區段不是人待的。\n智邦在1000震盪到開始懷疑自己的眼光。\n世芯盤整整整一年。\n家登跌到懷疑人生。\n\n回頭看，好像都是笑話。\n想當初，是無盡的折磨。\n好像之前那些煎熬根本沒發生過。\n\n我們的腦袋就是這樣設計的——\n好了傷疤，忘了痛。\n\n市場最殘忍的地方也在這裡：\n它只給撐過去的人獎勵，\n但它從來不會提醒你，撐過去有多難。\n\n你的賣飛清單上，現在排第一名的是哪一檔？\n\n這兩天的修正有沒有人腦子冷靜一點?"},{"id":"A20260507-18","type":"方法","title":"外資空單五萬口，還不快逃？","date":"2026-05-07","series":"","seq":0,"tags":["市場觀察"],"gist":"先做比例尺：空單是預告，現貨賣壓才是本體","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02Abd36FP45R8iarMBZip112L1Bg23ourNUyC7uQNeGJTQHe1j6wRMdDQHLRLB9XQ4l&id=61571663936725","body":"\"外資空單五萬口，還不快逃？\"\n\n空襲警報響起來了!!! (伍佰老師音樂請下~)\n冷靜一下，我們來看數字說什麼。\n外資台指期貨空單突破五萬口，\n聽起來很恐怖，但先做個比例尺：\n外資持有台股約60兆，\n這批空單的名目價值約0.4兆\n佔比不到1%。\n我們會用不到1%的部位去避險嗎?\n\n外資空單的本質只有一件事：\n外資認為台股短期偏空，\n用期貨先表態，但表態不等於行動。\n歷史數據顯示，空單突破五萬口之後，\n後續二十個交易日內指數跌超過五趴的次數佔多數。\n不是每次都跌，但機率站在空方那邊。\n\n空單是預告，現貨賣壓才是本體。\n目前外資現貨仍在買超，\n代表意圖跟行動還沒對齊。\n真正要盯的只有一件事：\n空單是繼續加，還是開始回補？回補就是上漲的燃料，不是嗎?\n\n【五萬口空單放在眼前，你怎麼辦？】\n\nA｜RUN！未實現都是浮雲，獲利入袋，手拿哀鳳才是真的。\nB｜蛤？漲就是追，問就是買！\nC｜呈戰鬥蹲姿，拔草測風向。"},{"id":"A20260506-17","type":"心法","title":"夜盤大漲，散戶 PTSD？","date":"2026-05-06","series":"","seq":0,"tags":["投資心態","市場觀察"],"gist":"高檔時美股大漲、隔天高開，常是出貨良機；先知道自己坐在牌局哪個位置","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02LmTycrhpCcCW5MreLJLtMqeaJjvi4zV88LbnosWiisc2Mbs7C8oY3wcpGJTP8c2Tl&id=61571663936725","body":"【夜盤大漲，散戶PTSD?】\n\n美股昨晚大漲，台指夜盤大漲700點，眾人摩拳擦掌。\n隔天台股開盤，跳空高開，散戶魚貫而入~\n然後——跳水。\n「怎麼了？發生什麼事？」\n沒發生什麼事。\n這就是劇本。\n\n台股相對高檔的時候，美股大漲是個訊號——\n不是買進的訊號，是出貨的良機。\n開盤量大、人多、情緒熱，\n正是大戶最好的出貨時機。\n散戶追高，大戶拋籌碼。\n等散戶問「怎麼跳水」，大戶已經在低點接回來了... OOXX\n\n這不是陰謀論，是市場裡每天都在發生的心理博弈。\n我們還不是大戶，\n但至少要知道，自己在這場牌局裡坐的是哪個位置。\n\n【美股大漲的隔天，你會怎麼做？】\n\nA｜送分題來啦！離職信準備送出。\nB｜賣出的訊號來了，等會再回來撿。\nC｜等一下，看開盤方向再決定。"},{"id":"A20260505-16","type":"心法","title":"滿天全金條，欲抓無半條","date":"2026-05-05","series":"","seq":0,"tags":["投資心態"],"gist":"用結果判斷對錯是在考試，不是在投資","fb":"https://www.facebook.com/permalink.php?story_fbid=pfbid02Dfdm4bbhKWyLKKSWkgwyFiMCXGQYPpczNDKRxpt4NecKb2HWyjSTBez4cqBjC6rgl&id=61571663936725","body":"「滿天全金條，欲抓無半條???」\n\n5月台股站穩4萬點了!!\n臉書上到處是報酬率的截圖，以及我是否適合全職投資的問題...\n\n這時心裡有個聲音悄悄冒出來：\n為什麼漲的不是我的股票？\n這個感覺，我們都有過。\n不是嫉妒。是一種很具體的懷疑——\n我哪裡做錯了？\n\n於是我們開始往回找答案。\n某檔漲了三倍，現在看起來理由清清楚楚。\n產業對、時機對、題材對。\n每個環節好像都顯而易見。\n\n但那是因為我們已經知道結果了。\n在考試裡，這叫對答案。\n在投資裡，這叫馬後炮。\n\n沒有人在群組裡曬虧損的截圖。\n我們看到的，都是已經發生的漲幅——\n然後拿這個漲幅來質問自己當初的決定。\n這樣問，永遠答不完。\n\n說穿了，投資本來就有賭博的成分。\n差別在於：賭徒靠運氣，我們靠研究。\n透過研究產業、拼湊蛛絲馬跡，\n我們做的事只有一件：\n不可能每次都贏，盡量讓自己站在贏面大的那一側。\n時間久了，自然久賭必贏。\n\n決策對了，結果不見得好，而且永遠有更好的沒選到。\n決策錯了，有時候剛好賺到。\n用結果來判斷對錯，是在考試，不是在投資。\n真正該問的不是「為什麼沒買那檔」，\n而是：我的研究，有沒有在對的方向上持續押注？\n\n[你今天FOMO了嗎？]\n\nA｜有。買進什麼族群？為什麼？股價創新高還敢追？\nB｜沒有。早不買晚不買，何必在四萬點歐印？\nC｜問就是買，錢不是問題，問題是沒錢。"},{"id":"A20250606-11","type":"盤感","title":"川普被制衡，是長期投資的好消息","date":"2025-06-06","series":"","seq":0,"tags":["市場觀察"],"gist":"制衡讓長期不穩定因素下降，短期波動難免","fb":"","body":"久久沒發表意見～\n\n最近川普政府遇到一系列的動盪，\n外行人看熱鬧\n我認為逐漸削弱川普的影響力，\n例如法院制衡對等關稅，\nMusk公然批評大而美減稅法案。\n看似亂成一鍋粥，實則讓長期資本市場不穩定的因素持續下降⬇️，短期波動難免。\n\n因為大家現在都知道，\n有體系跟人可以制衡川普，\n美國總統有權，但也不能為所欲為，\n這是民主制度的好處，也是美股可以長期投資的原因。"},{"id":"A20250415-10","type":"心法","title":"投資其實是認識自己的過程","date":"2025-04-15","series":"","seq":0,"tags":["長期投資","水位與風險"],"gist":"生活型態決定策略比例，再找方法強化，避免追高殺低","fb":"","body":"投資其實是認識自己的過程\n你的生活型態 你的金錢觀 價值觀 個性\n以及你的工作\n會決定你適合的投資方式\n\n我花了不少時間在摸索，體會\n我不能盯盤，喜歡的東西不喜歡賣，\n不需要現金流。\n\n因此，我決定資產配置的比例，4成是長期部位，買符合未來趨勢有競爭優勢的股票（條件看自己）。逢低分批買到4成的部位，公司沒變，我就不變。過程中會碰到回檔，可以硬扛，也可以用避險方式降低資產波動（雖然也有成本，但不用來回買賣）\n\n總之，認識自己，決定投資的策略配置比例，然後再找適合的方法，強化這個策略，以免心態不穩，追高殺低。"},{"id":"A20250315-09","type":"心法","title":"投資要看總經，還是產業？","date":"2025-03-15","series":"","seq":0,"tags":["水位與風險"],"gist":"重點是取捨：一個多頭抱得住、修正收得回、估值合理敢買的配置","fb":"","body":"有人問，投資要看總經，還是產業？\n我覺得投資重要的是取捨。\n股市漲漲跌跌，在多頭的時候一定有回檔，在下跌的時候一定會有反彈\n沒有一個完美的策略不會吃到回吐\n\n所以我要的是一個配置\n讓我在多頭時可以持有到最後，在修正來的時候收回部分資金，在估值合理的時候敢於買進。\n要做一個好的配置不容易，要能堅定的持有更不容易。\n\n至於怎麼做，每個人的答案不同。"},{"id":"A20250203-07","type":"盤感","title":"2/3 開盤，大場面來了？","date":"2025-02-03","series":"","seq":0,"tags":["市場觀察","AI 與半導體"],"gist":"DeepSeek 與關稅夾擊：大膽假設、小心求證，短空長多","fb":"","body":"2/3開盤，大場面來了？？！\n兩個利空罩頂\n1. 過年期間Deepseek新模型讓費半碎滿地\n2. 2/1起川普關稅對決加拿大與墨西哥，還有晶片課稅的再次宣布。\n\n先說結論，既然都抱股過年了，就讓子彈飛一會，如果有恐慌性賣壓會先減碼，做好長期抗戰。\n\n凡事大膽假設，小心求證，\n1. 假設DS模型讓AI服務的成本降低，且讓美國覺醒晶片禁令徒勞無功。可能會加大美國投資AI晶片與服務的決心，而且更便宜的算力有利於AI應用的落地，一個商品的成功關鍵之一向來是合理的售價。\n=》AI硬體供應鏈盤整難免，但短空長多，AI基礎建設與軟體服務則是觀察重點。\n\n2. 假設川普關稅大戰無差別攻擊，那除了美國進口成本部分上升，反而是供應鏈重新洗牌的機會。例如本來台灣銷美的鋼材本來就課稅25%，那加拿大跟墨西哥也25%，豈不是重新公平競爭？ 本來加墨產品售價才有競爭力，現在其他賣家也能來比個高下，那商品價格上升幅度恐低於預期喔！\n\n新的變動代表新的機會，\n也考驗投資人的眼光。"},{"id":"A20250122-06","type":"方法","title":"投資正二之前，先搞懂曝險與複利偏移","date":"2025-01-22","series":"","seq":0,"tags":["水位與風險","長期投資"],"gist":"半倉正二＋半倉現金再平衡：曝險相同，心態更穩","fb":"","body":"若要投資正二等槓桿型產品\n請先搞懂 「曝險，複利偏移 ，波動率」\n\n以下用兩個表比較0050 跟正二投資績效\n（非個人操作，僅為試算結果）\n無腦選前10年的區間\n0050投入160萬\n0050正2投一半的金額80萬，\n曝險相同160萬\n\n因為複利偏移\n0050期末572萬\n正2   期末827萬\n年化報酬率接近2倍\n\n如果自有資金160萬歐印0050\n還是80萬正二 ，另外80萬現金等年線加碼\n\n哪一個投資方式心態更穩定？更心安？\n我個人認為漲上去再平衡換現金，跌下來有錢可以逢低買進，在長期向上趨勢的市值型ETF 是一個可執行的好策略！"},{"id":"A20250110-04","type":"盤感","title":"非農公布前，我的劇本","date":"2025-01-10","series":"","seq":0,"tags":["市場觀察"],"gist":"數據好壞 × 漲跌，四種情境各自怎麼做","fb":"","body":"非農+失業率公佈在即，我打算這麼做\n\n若優於預期，\n卻下跌，看好底部要敢接。\n若上漲，則進場停損抓近，看錯也不會損失慘重。\n\n若不如預期，\n若下跌，現股依紀律停損\n若上漲，現股順勢調節賣出槓桿部位。"}]};</script>
<script>
(function () {
  const S = window.SITE, A = S.articles, app = document.getElementById('app');
  const TYPES = ['心法', '方法', '研究', '盤感'];
  const TYPE_DESC = { 心法: '我走過的掙扎', 方法: '我想通的方法', 研究: '產業與公司的深度分析', 盤感: '當週盤面的狀態紀錄' };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const byId = Object.fromEntries(A.map((a) => [a.id, a]));
  const fmt = (d) => d.replace(/-/g, '/');
  const track = (p) => { try { window.goatcounter && window.goatcounter.count({ path: p }); } catch (e) {} };

  function card(a) {
    return `<a class="card" href="#${a.id}">
      <div class="card-top"><span class="type ${a.type}">${a.type}</span><span>${fmt(a.date)}</span>${a.series ? `<span>｜${esc(a.series)} ${a.seq}</span>` : ''}</div>
      <h3>${esc(a.title)}</h3>
      <p class="gist">${esc(a.gist)}</p>
      <div class="tags">${a.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div></a>`;
  }

  let fType = '全部', fTag = '全部';
  function home() {
    document.title = '德克觀點｜文章';
    const featured = S.featured.map((id) => byId[id]).filter(Boolean);
    const series = S.series.map((s) => {
      const items = A.filter((a) => a.series === s.name).sort((x, y) => x.seq - y.seq);
      const drafts = (s.upcoming || []).map((u) => `<li class="soon">${esc(u)}（即將發表）</li>`).join('');
      return `<div class="series"><h3>${esc(s.name)}</h3><p class="gist" style="margin:0 0 .4rem">${esc(s.desc)}</p><ol>${items.map((a) => `<li><a href="#${a.id}">${esc(a.title)}</a></li>`).join('')}${drafts}</ol></div>`;
    }).join('');
    const list = A.filter((a) => (fType === '全部' || a.type === fType) && (fTag === '全部' || a.tags.includes(fTag)));
    app.innerHTML = `
      <section class="hero">
        <h1>德克觀點</h1>
        <p>${esc(S.intro)}</p>
        <p>FB 是入口，這裡是完整版：${A.length} 篇文章，照類型、系列、主題整理。</p>
      </section>
      <section class="sec"><h2>精選</h2><div class="grid">${featured.map(card).join('')}</div></section>
      <section class="sec"><h2>系列</h2><div class="grid">${series}</div></section>
      <section class="sec" id="all"><h2>全部文章</h2>
        <div class="filters">${['全部', ...TYPES].map((t) => `<button class="chip ${t === fType ? 'on' : ''}" data-type="${t}">${t}${t !== '全部' ? `｜${TYPE_DESC[t]}` : ''}</button>`).join('')}</div>
        <div class="filters">${['全部', ...S.tags].map((t) => `<button class="chip ${t === fTag ? 'on' : ''}" data-tag="${t}">${t === '全部' ? '全部主題' : t}</button>`).join('')}</div>
        <p class="count">${list.length} 篇</p>
        <div class="grid">${list.map(card).join('')}</div>
      </section>
      <p class="disclaimer">德克觀點｜個人投資紀錄與心得，不構成任何投資建議。文章原發表於 Facebook 粉專「德克 mur mur」。</p>`;
    app.querySelectorAll('[data-type]').forEach((b) => b.onclick = () => { fType = b.dataset.type; home(); document.getElementById('all').scrollIntoView(); });
    app.querySelectorAll('[data-tag]').forEach((b) => b.onclick = () => { fTag = b.dataset.tag; home(); document.getElementById('all').scrollIntoView(); });
  }

  function article(a) {
    document.title = a.title + '｜德克觀點';
    let sernav = '';
    if (a.series) {
      const items = A.filter((x) => x.series === a.series).sort((x, y) => x.seq - y.seq);
      const i = items.findIndex((x) => x.id === a.id);
      const prev = items[i - 1], next = items[i + 1];
      sernav = `<div class="sernav">${esc(a.series)}（第 ${a.seq} 篇）　${prev ? `← <a href="#${prev.id}">${esc(prev.title)}</a>` : ''}　${next ? `<a href="#${next.id}">${esc(next.title)}</a> →` : ''}</div>`;
    }
    const related = A.filter((x) => x.id !== a.id && x.tags.some((t) => a.tags.includes(t))).slice(-3).reverse();
    app.innerHTML = `
      <a class="back" href="#">← 回文章列表</a>
      <article class="art">
        <div class="meta"><span class="type ${a.type}">${a.type}</span><span>${fmt(a.date)}</span>${a.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <h1>${esc(a.title)}</h1>
        ${sernav}
        <div class="body">${esc(a.body)}</div>
        <div class="art-foot">
          ${a.fb ? `<a class="btn main" href="${esc(a.fb)}" target="_blank" rel="noopener">到 FB 原文留言討論 →</a>` : '<span></span>'}
          <a class="btn" href="#">看其他文章</a>
        </div>
      </article>
      ${related.length ? `<section class="sec"><h2>相關主題</h2><div class="grid">${related.map(card).join('')}</div></section>` : ''}
      <p class="disclaimer">本文為個人紀錄與心得，不構成投資建議。</p>`;
    window.scrollTo(0, 0);
  }

  function route() {
    const id = decodeURIComponent(location.hash.slice(1));
    if (id && byId[id]) { article(byId[id]); track('/six-lights/articles/' + id); }
    else home();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script data-goatcounter="https://dirkmurmur.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
